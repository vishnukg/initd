# Installed to /etc/dracut.conf.d/ by linux/setup.sh:configure_initramfs_bluetooth
# (copied, not linked: dracut runs as root from kernel %posttrans, and a
# root-read build input should not live in a user-writable checkout).
#
# The root filesystem is LUKS, so the passphrase is typed in the initramfs,
# before the real system is up. dracut no longer pulls its
# bluetooth module in on its own in host-only mode -- every kernel install
# warns "If you need to use bluetooth, please include it explicitly" -- so
# without this a Bluetooth keyboard cannot type the passphrase. The module
# also carries the pairing from /var/lib/bluetooth, so the keyboard must be
# paired in the running system before the initramfs is rebuilt.
add_dracutmodules+=" bluetooth "
