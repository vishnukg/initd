# Tokyo Night
[colors]
bg       = #00000000
bg-alt   = #00000000
fg       = #c0caf5
fg-dim   = #565f89
blue     = #89b4fa
blue-alt = #bb9af7
red      = #f7768e
green    = #9ece6a
yellow   = #e0af68
orange   = #ff9e64

[bar/main]
# POLYBAR_* env vars are exported by launch.sh, scaled to the session Xft.dpi
# (set per autorandr profile by display-dpi.sh). Fallbacks = the 144-DPI look.
monitor               = ${env:MONITOR:}
width                 = 100%
height                = ${env:POLYBAR_HEIGHT:46}
dpi                   = ${env:POLYBAR_DPI:96}
background            = ${colors.bg}
foreground            = ${colors.fg}
line-size             = 2
border-size           = 0
padding-left          = 2
padding-right         = 2
module-margin-right   = 2
; font-0 = text (digits/labels); font-1 = icons, rendered via the %{T2} tag
; Point sizes live in launch.sh (scaled by the dpi key); the ;N baseline
; offsets are pixels, so launch.sh recomputes them per DPI too.
font-0                = ${env:POLYBAR_FONT0:FiraCode Nerd Font Mono:style=Bold:size=20;5}
font-1                = ${env:POLYBAR_FONT1:FiraCode Nerd Font Mono:style=Bold:size=31;7}
font-2                = ${env:POLYBAR_FONT2:FiraCode Nerd Font Mono:style=Bold:size=23;6}
modules-left          = workspaces
modules-center        =
modules-right         = ${env:POLYBAR_MODULES_RIGHT:cpu memory wlan pulseaudio backlight powerprofile battery tray date}
wm-restack            = i3
override-redirect     = false
cursor-click          = pointer
cursor-scroll         = ns-resize
enable-ipc            = true

[module/workspaces]
type     = custom/script
exec     = ~/.config/polybar/workspaces.sh
tail     = true

[module/date]
type                     = internal/date
interval                 = 5
date                     = %a %d %b
time                     = %H:%M
format-prefix            = "%{T2}󰃭%{T-} "
label                    = %date% %time%

[module/pulseaudio]
type                   = internal/pulseaudio
use-ui-max             = false
format-volume          = <ramp-volume> <label-volume>
label-volume           = %percentage%%
label-muted            = %{T2}󰝟%{T-} muted
label-muted-foreground = ${colors.fg-dim}
ramp-volume-0          = %{T2}󰕿%{T-}
ramp-volume-1          = %{T2}󰖀%{T-}
ramp-volume-2          = %{T2}󰕾%{T-}

[module/backlight]
type                  = internal/backlight
card                  = intel_backlight
use-actual-brightness = true
enable-scroll         = true
format                = <ramp> <label>
label                 = %percentage%%
ramp-0                = %{T2}󰃞%{T-}
ramp-1                = %{T2}󰃟%{T-}
ramp-2                = %{T2}󰃠%{T-}

[module/wlan]
type                          = internal/network
interface                     = wlp85s0f0
interval                      = 5
format-connected              = <ramp-signal> <label-connected>
label-connected               = %essid%
label-disconnected            = %{T2}󰤭%{T-} --
label-disconnected-foreground = ${colors.fg-dim}
ramp-signal-0                 = %{T2}󰤨%{T-}

[module/battery]
; Script instead of internal/battery: the internal module renders the
; firmware's "Not charging" hold state (plugged in, battery kept at its
; threshold) as discharging. See battery-status.sh.
type     = custom/script
exec     = ~/.config/polybar/battery-status.sh
interval = 5

[module/powerprofile]
type             = custom/script
exec             = ~/.config/power-profile-status.sh
interval         = 5
click-left       = ~/.config/power-profile-cycle.sh
label            = %{T2}%output%%{T-}

[module/cpu]
type                     = internal/cpu
interval                 = 2
format-prefix            = "%{T2}󰍛%{T-} "
label                    = %percentage:2%%

[module/memory]
type                     = internal/memory
interval                 = 3
format-prefix            = "%{T2}󰾆%{T-} "
label                    = %percentage_used:2%%

[module/tray]
type         = internal/tray
tray-padding = ${env:POLYBAR_TRAYPAD:6px}
tray-maxsize = ${env:POLYBAR_TRAYMAX:16}
