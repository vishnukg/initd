# 6-band EQ for the XPS 13 cs42l43 speakers: Linux's SOF driver doesn't apply
# the vendor DSP curve Windows/macOS do, so stock output is thin/bright with a
# harsh, tinny 3-6kHz peak. Tuned by ear (linux/setup.sh:enable_audio_eq sets
# this as the default sink + applies makeup gain, since removing that much
# energy from the upper-mid/treble drops perceived loudness):
#   - warm bass shelf, mild low-mid dip to avoid boxiness
#   - +3dB presence bump at 2kHz so vocals stay forward/intelligible
#   - a deep, fairly wide cut from ~3-8kHz to kill the driver's resonance
#     (this is most of what makes the stock output sound tinny)
# Source template: /usr/share/pipewire/filter-chain/sink-eq6.conf
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Equalizer Sink"
            media.name       = "Equalizer Sink"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 100.0 "Q" = 0.8 "Gain" = 5.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 250.0 "Q" = 1.0 "Gain" = -1.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 2000.0 "Q" = 1.0 "Gain" = 3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 3200.0 "Q" = 1.1 "Gain" = -6.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 5500.0 "Q" = 1.1 "Gain" = -9.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_highshelf
                        control = { "Freq" = 5500.0 "Q" = 0.7 "Gain" = -8.0 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                ]
            }
	    audio.channels = 2
	    audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.eq6"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "effect_output.eq6"
                node.passive = true
            }
        }
    }
]
