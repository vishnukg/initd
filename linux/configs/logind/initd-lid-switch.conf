# Installed to /etc/systemd/logind.conf.d/ by linux/setup.sh:configure_lid_switch
# (copied, not linked: a root-read policy file should not live in a
# user-writable checkout).
#
# Closing the lid on external power does nothing; on battery it still suspends.
#
# logind skips the lid-close suspend only while it sees an external display
# that is connected AND enabled (HandleLidSwitchDocked). Hyprland's DPMS off
# disables the output outright, so in clamshell mode hypridle's screen-off at
# 630 s made the Dell look absent, and logind suspended the laptop about two
# minutes later with no lid event at all. Resuming then raced the monitor's
# USB-C link renegotiation while hyprlock held the session. The external
# monitor charges the laptop over USB-C, so "on external power" covers every
# clamshell setup without depending on how the compositor blanks the screen.
[Login]
HandleLidSwitchExternalPower=ignore
