#################################################################
# picom v13 — Hyprland-style compositing for i3
#
# Requires picom >= v12 (animation engine, `rules`, dual_kawase
# blur). linux/setup.sh builds v13 from source into /usr/local/bin
# because Mint/Ubuntu apt only ships v10.
#################################################################

# ── Backend / general ──────────────────────────────────────────
backend = "glx";
vsync = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Disabled: use-damage=true causes pink/magenta artifacts on Intel Arc when
# browser GL rendering races with picom's partial damage redraws.
use-damage = false;

log-level = "warn";

# ── Rounded corners ────────────────────────────────────────────
corner-radius = 12;

# ── Shadows ────────────────────────────────────────────────────
# Large, soft, offset-up-left — the floating-window look.
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.55;
shadow-offset-x = -18;
shadow-offset-y = -16;

# ── Fading ─────────────────────────────────────────────────────
# Smooths opacity changes; open/close motion is handled by `animations`.
fading = true;
fade-in-step = 0.045;
fade-out-step = 0.045;
fade-delta = 6;

# ── Blur ───────────────────────────────────────────────────────
# Frosted glass behind anything translucent (ghostty already runs
# background-opacity < 1, so the terminal picks this up for free).
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

# ── Animations (the Hyprland feel) ─────────────────────────────
# i3 unmaps/maps windows on workspace switch, so show/hide triggers
# double as workspace-switch animations.
animations = (
  # New / re-shown windows zoom + fade in
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.9;
    duration = 0.15;
  },
  # Closed / hidden windows zoom + fade out
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.9;
    duration = 0.11;
  },
  # Tiling rearrangements, resizes and moves glide instead of snapping
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.16;
  }
)

# ── Per-window rules ───────────────────────────────────────────
# NOTE: when `rules` is set, legacy wintypes/*-exclude options are
# ignored — everything window-specific lives here. Later matching
# rules override earlier ones.
rules = (
  # Bars and desktop: square, opaque, shadowless. Polybar slides in
  # from the top edge instead of zooming.
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
    animations = (
      { triggers = [ "open", "show" ]; preset = "slide-in"; direction = "down"; duration = 0.14; },
      { triggers = [ "close", "hide" ]; preset = "slide-out"; direction = "up"; duration = 0.10; }
    );
  },
  # GTK client-side-decorated windows draw their own shadow in the
  # invisible frame-extents region — don't stack ours on top.
  {
    match = "_GTK_FRAME_EXTENTS@";
    shadow = false;
    blur-background = false;
  },
  # Menus, tooltips, DnD: square and quick — a slow zoom on every
  # popup menu feels laggy, not fancy.
  {
    match = "window_type = 'tooltip' || window_type = 'menu' || "
            "window_type = 'dropdown_menu' || window_type = 'popup_menu' || "
            "window_type = 'combo' || window_type = 'dnd'";
    corner-radius = 0;
    shadow = false;
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.96; duration = 0.08; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.96; duration = 0.08; }
    );
  },
  # Rofi: slight translucency so the dual_kawase blur shows through
  {
    match = "class_g = 'Rofi'";
    opacity = 0.92;
  },
  # Dunst notifications slide in from the top (dunst sits top-right)
  {
    match = "class_g = 'Dunst'";
    animations = (
      { triggers = [ "open", "show" ]; preset = "slide-in"; direction = "down"; duration = 0.12; },
      { triggers = [ "close", "hide" ]; preset = "slide-out"; direction = "up"; duration = 0.10; }
    );
  },
  # Legacy shadow excludes carried over from the v10 config
  {
    match = "name = 'Notification' || class_g = 'Conky' || "
            "class_g ?= 'Notify-osd' || class_g = 'Cairo-clock' || "
            "name = 'cpt_frame_window'";
    shadow = false;
  }
)
