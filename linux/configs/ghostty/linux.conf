# Linux-only Ghostty settings.
#
# Symlinked into shared/configs/ghostty/.config/ghostty/linux.conf by
# linux/setup.sh:link_ghostty_linux_conf, and pulled in by the
# `config-file = ?linux.conf` line at the END of the shared config (later values
# win, so this file has to be included last to override anything above it).
#
# Ghostty has no per-OS include like kitty's `include ${KITTY_OS}.conf` —
# config-file does no variable expansion — so the file has to be placed here by
# the platform script rather than selected by name at load time. Most of
# Ghostty's OS-specific settings do not need this at all: macos-* and gtk-*
# options are silently inert on the wrong platform, so they live in the shared
# config. Only a value that differs between platforms has to be split out.

# Linux runs more opaque than the 0.58 the shared config ships for macOS. This
# cannot be a `--background-opacity=` launch flag: Ghostty is started from the
# $mod+SHIFT+ALT+Return bind, rofi, .desktop entries and scripts, and only the
# keybind could carry a flag — the rest would render at the macOS value.
background-opacity = 0.92
