# Linux-only Ghostty settings, linked beside the shared config by
# linux/scripts/config-links.mjs and included by its last line
# (`config-file = ?linux.conf`) - see the comment there for why Ghostty needs a
# placed file where kitty uses `include ${KITTY_OS}.conf`.

# More opaque than macOS's 0.58. A config value rather than a launch flag, so
# every launcher (keybind, rofi, scripts) gets it.
background-opacity = 0.92

# No cursor trail on Linux: an empty value clears the shared config's
# custom-shader list. A custom shader makes Ghostty redraw every frame rather
# than on change; at 4K that kept this laptop's iGPU render engine 92% busy at
# full clock with the window hidden on another workspace - twice what Hyprland
# itself used - and the whole desktop lagged (2026-11-09). macOS keeps it.
custom-shader =

# The shared config adds one pixel to Ghostty's cell to match kitty's grid on a
# Retina Mac, where kitty rounds its cell up and Ghostty to nearest. Here at
# 1.33x both already land on the same height (35 px), and the extra pixel only
# made Ghostty's cell 18 px wide against kitty's 17 - letters visibly spaced
# out (tmux client_cell_width, 2026-11-09). Empty resets to the default.
adjust-cell-width =
