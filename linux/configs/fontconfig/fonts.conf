<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- EDITING NOTE: never write a double hyphen inside these comments (XML
       forbids it), which means CLI flags have to be written without their
       leading dashes: "kitty's debug-font-fallback flag", not the flag itself.
       Get it wrong and fontconfig prints one error to stderr, EXITS 0, and
       silently drops every rule in this file. Measured: the Berkeley Mono rule
       below stopped applying and only the Regular face kept spacing=100, which
       is exactly the state that sends bold and italic to FiraCode. Nothing in
       the bootstrap would catch it, because the exit code says success.
       Validate after editing: python3 -c "import xml.dom.minidom as m;
       m.parse('linux/configs/fontconfig/fonts.conf')" -->

  <!-- Smooth grayscale rendering for fractional-scale Wayland. Subpixel
       rendering assumes fixed RGB stripes; scaling can create color fringes. -->
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <!-- Inter has high-quality screen rendering and is packaged by Fedora. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <!-- The Nerd Font build's exact name. "Fira Code" was preferred here for
           as long as this file existed, but no such family is installed, so
           every generic monospace request fell through to Noto Sans Mono —
           which is what Ghostty was actually rendering. The plain (non-Mono)
           build, matching the terminals: icons keep their natural width rather
           than being squeezed into one cell. -->
      <family>FiraCode Nerd Font</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- LOAD-BEARING FOR THE TERMINAL FONT. Do not delete this rule.

       shared/configs/kitty/.config/kitty/kitty.conf sets Berkeley Mono as the
       terminal font on both platforms. On Linux that only works because of the
       rule below; macOS goes through CoreText and needs nothing here.

       Berkeley Mono declares spacing=100 (FC_MONO) on the Regular OTF only —
       every other weight and all the obliques leave the property unset, because
       a handful of glyphs out of 645 deviate from the 600-unit advance and
       fontconfig therefore scans them as "not monospace". kitty's fontconfig
       backend queries :spacing=100 when resolving a text face, so without this
       rule those faces are invisible to matching and kitty falls back — and the
       postscript_name pins in kitty.conf do NOT rescue it.

       Measured on kitty 0.48.2 with this rule removed and nothing else changed:
       Normal stayed on Berkeley while Bold, Italic and Bold-Italic all silently
       resolved to FiraCode Nerd Font. No warning is logged; the terminal simply
       renders bold and italic in the wrong typeface, which is easy to miss
       because both are monospace.

       Force the whole family to mono at scan time. After any change here run
       `fc-cache -f ~/.local/share/fonts` (scan-time edits are baked into the
       cache) and verify with kitty's debug-font-fallback flag. -->
  <match target="scan">
    <test name="family"><string>Berkeley Mono</string></test>
    <edit name="spacing" mode="assign"><int>100</int></edit>
  </match>
</fontconfig>
