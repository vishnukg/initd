<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Smooth grayscale rendering for fractional-scale Wayland. Subpixel
       rendering assumes fixed RGB stripes; scaling can create color fringes. -->
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <!-- Inter has high-quality screen rendering and is packaged by Fedora. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <!-- The Nerd Font build's exact name. "Fira Code" was preferred here for
           as long as this file existed, but no such family is installed, so
           every generic monospace request fell through to Noto Sans Mono —
           which is what Ghostty was actually rendering. The plain (non-Mono)
           build, matching the terminals: icons keep their natural width rather
           than being squeezed into one cell. -->
      <family>FiraCode Nerd Font</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Berkeley Mono ships spacing=100 (FC_MONO) only on the Regular OTF; every
       other weight and all the obliques leave the property unset. kitty's
       fontconfig backend queries :spacing=100 when resolving a text face, so
       bold/italic/bold-italic silently fell through to FiraCode Nerd Font
       while Regular rendered correctly - a mismatch that is easy to miss
       because both faces are monospace. Force the whole family to mono at
       scan time. Verify with kitty's debug-font-fallback flag. -->
  <match target="scan">
    <test name="family"><string>Berkeley Mono</string></test>
    <edit name="spacing" mode="assign"><int>100</int></edit>
  </match>
</fontconfig>
