# Installed to /etc/systemd/logind.conf.d/ by linux/setup.sh:install_lid_lock_only.
#
# Lock instead of suspend on lid close. The XPS 13's Intel xe driver
# (Wildcat Lake) has a live, unfixed kernel bug where the Hyprland
# compositor's display-resume path hangs after s2idle resume — confirmed via
# `hyprctl` timing out with "Hyprland IPC didn't respond in time" while the
# kernel itself reports a clean resume. Every lid-close-suspend attempt
# during testing ended in a frozen or black screen requiring a hard reboot.
# mem_sleep_default=deep was also tried and made it worse (hung outright —
# this hardware's firmware has no working S3 resume path at all).
#
# Until upstream fixes the xe driver, lock-only avoids suspend/resume
# entirely on lid close. hypridle already listens for logind's Lock signal
# and runs hyprlock, so this needs no other plumbing. Costs battery while
# the lid is closed (same draw as leaving it open and locked) — worth it to
# not lose work / need a hard reboot.
[Login]
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=lock
