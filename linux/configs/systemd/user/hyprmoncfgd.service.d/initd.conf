# The packaged unit is WantedBy=default.target, so it starts with the user
# manager — before Hyprland exists — and its first apply fails ("hyprctl
# instances" is empty) until a poll ~5s later. It also starts under GNOME,
# where it can never succeed. linux/setup.sh:enable_hyprmoncfg therefore
# drops the default.target want and adds a graphical-session.target one:
# that target is reached by initd-hyprland-session.service only after the
# session environment is imported, and this condition keeps it Hyprland-only.
[Unit]
ConditionEnvironment=XDG_CURRENT_DESKTOP=Hyprland

# Wake settle: the daemon's default (2 s) is in force. 1.17 needed
# `--wake-settle 8s` here because, when the monitor's USB-C plug-in was the
# resume event, the Dell's link came up 4-5 s after resume and 2 s had the
# daemon pick `laptop` (panel inside the closed lid), then the Dell 1.2 s
# after its hotplug while its link was still training (EBUSY commits). The
# cost was the other direction: every resume whose last profile left the
# panel off showed it after 8-13 s (each event during the settle restarts
# the wait). hyprmoncfg 1.27+ debounces hotplug and 1.20+ retries a wake
# that leaves a display asleep, so the override was dropped on 2026-11-05
# to retest the plug-in resume at the default; docs/linux-monitors.md.
#
# hyprmoncfg itself is installed from its upstream release rpm
# (linux/scripts/hyprmoncfg-install.sh).
