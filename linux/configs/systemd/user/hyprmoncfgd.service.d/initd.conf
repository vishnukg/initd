# The packaged unit is WantedBy=default.target, so it starts with the user
# manager — before Hyprland exists — and its first apply fails ("hyprctl
# instances" is empty) until a poll ~5s later. It also starts under GNOME,
# where it can never succeed. linux/setup.sh:enable_hyprmoncfg therefore
# drops the default.target want and adds a graphical-session.target one:
# that target is reached by initd-hyprland-session.service only after the
# session environment is imported, and this condition keeps it Hyprland-only.
[Unit]
ConditionEnvironment=XDG_CURRENT_DESKTOP=Hyprland

# Wake settle 1 s (daemon default 2 s). The settle is the quiet period
# after a resume before a profile is picked, restarted by every event that
# lands inside it, and it is the one timer on every wake path: on
# 2026-11-08 a plug-in wake took 3.3 s (2.0 s settle + 1.2 s apply) and a
# lid-open after an unplugged sleep 4.5 s (the 5 s monitor poll noticed the
# Dell gone 1.9 s in, restarting the settle for another 2 s, then 0.5 s
# apply). In all four plug-in wakes that day the Dell was reported within
# 0.6 s of resume, so 1 s still outlasts the link coming up.
#
# History: 1.17 needed `--wake-settle 8s` because, when the monitor's USB-C
# plug-in was the resume event, the Dell's link came up 4-5 s after resume
# and 2 s had the daemon pick `laptop` (panel inside the closed lid), then
# the Dell 1.2 s after its hotplug while its link was still training (EBUSY
# commits). The cost was the other direction: every resume whose last
# profile left the panel off showed it after 8-13 s. hyprmoncfg 1.27+
# debounces hotplug and 1.20+ retries a wake that leaves a display asleep,
# so the override was dropped on 2026-11-05 and the default retested; the
# Dell at 4K 60 Hz (one pipe, no DSC) is what made the shorter window safe.
# If a monitor ever arrives later than 1 s after resume the panel lights
# inside the closed lid for a moment and the retry switches it; if that
# shows up, go back to the default. docs/linux-monitors.md has the timings.
[Service]
ExecStart=
ExecStart=/usr/bin/hyprmoncfgd --wake-settle 1s

# hyprmoncfg itself is installed from its upstream release rpm
# (linux/scripts/hyprmoncfg-install.sh).
