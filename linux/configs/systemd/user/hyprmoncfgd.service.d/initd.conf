# The packaged unit is WantedBy=default.target, so it starts with the user
# manager — before Hyprland exists — and its first apply fails ("hyprctl
# instances" is empty) until a poll ~5s later. It also starts under GNOME,
# where it can never succeed. linux/setup.sh:enable_hyprmoncfg therefore
# drops the default.target want and adds a graphical-session.target one:
# that target is reached by initd-hyprland-session.service only after the
# session environment is imported, and this condition keeps it Hyprland-only.
[Unit]
ConditionEnvironment=XDG_CURRENT_DESKTOP=Hyprland

# Resuming a closed laptop into clamshell mode (the monitor's USB-C plug-in
# is the wake event): the Dell's DisplayPort link comes up 4-5 s after
# resume, but the default 2 s wake settle had the daemon pick a profile
# before the monitor existed. That meant `laptop` with the lid closed, which
# lights the panel inside the lid, and then the Dell profile 1.2 s after the
# monitor appeared, while its link was still training (the compositor logged
# refused commits, EBUSY). In the daemon every event during the settle
# restarts the full wait, so 8 s means the first apply after resume happens
# with the Dell present and ~8 s after its hotplug: one apply, straight to
# the Dell profile. The cost: a resume whose last profile left the panel off
# (unplugged while closed, suspended, opened elsewhere) shows the panel after
# ~8 s instead of ~2 s. hyprmoncfg 1.17 source: internal/daemon/daemon.go.
[Service]
ExecStart=
ExecStart=/usr/bin/hyprmoncfgd --wake-settle 8s
