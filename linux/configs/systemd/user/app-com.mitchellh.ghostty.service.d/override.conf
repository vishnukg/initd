# Drop-in over Fedora's packaged Ghostty unit, so the vendor unit stays
# untouched and package upgrades keep working. One Ghostty process owns every
# window: 574ms to open a terminal cold, ~250ms through the server.
#
# --quit-after-last-window-closed=false keeps it warm; the default stops the
#   unit as soon as the last terminal closes.
# --background-opacity is here rather than on the keybind because a
#   single-instance client forwards only the request -- config flags given to
#   the client are dropped -- so windows would otherwise come up at the 0.58 in
#   shared/configs/ghostty/config, which is shared with macOS and stays
#   untouched, and is unreadable over a bright wallpaper here.
#
# Empty ExecStart= first: drop-ins append, and a second entry is rejected
# unless the list is cleared.
[Service]
ExecStart=
ExecStart=/usr/bin/ghostty --gtk-single-instance=true --initial-window=false --quit-after-last-window-closed=false --background-opacity=0.92
