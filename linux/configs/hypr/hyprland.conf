# Hyprland config — direct port of the old i3 config (linux/configs/i3/config).
# Keybindings are kept 1:1 with i3; comments note the few places where a
# concept has no exact Hyprland equivalent.
# Reference: https://wiki.hypr.land/Configuring/

$mod = SUPER

# ── Monitors ──────────────────────────────────────────────────────────────────
# Wayland replaces the whole autorandr/xsettingsd/Xft.dpi machinery with
# per-monitor scale. 1.25 on the laptop panel (2560x1600, ~224 PPI); adjust
# per monitor if needed — this was 1.5 (tuned for the old machine's panel)
# until it looked oversized on this one.
monitor = eDP-1, preferred, auto, 1.25
monitor = , preferred, auto, 1.25

# Per-monitor overrides + workspace pinning, managed by the nwg-displays GUI
# (writes to these files on Apply). Named monitor rules there beat the
# catch-all above. See docs/linux-monitors.md.
source = monitors.conf
source = workspaces.conf

# Clamshell mode: lid closed with an external monitor → disable the panel
# (replaces autorandr-lid-listener). One script handles lid events, startup,
# and config reloads — `exec =` reruns on every reload, re-asserting the
# correct panel state after the static eDP-1 rule above re-enables it. The
# reload argument delays only this path; physical lid events remain immediate.
exec = ~/.config/clamshell.sh reload
bindl = , switch:on:Lid Switch, exec, ~/.config/clamshell.sh
bindl = , switch:off:Lid Switch, exec, ~/.config/clamshell.sh

# ── Input ─────────────────────────────────────────────────────────────────────
input {
    # setxkbmap -option ctrl:nocaps
    kb_options = ctrl:nocaps
    # xset r rate 200 35
    repeat_delay = 200
    repeat_rate = 35

    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── Autostart ─────────────────────────────────────────────────────────────────
# Make portals (screenshare, file pickers) see the session environment.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Polkit auth agent (GNOME ships its own inside gnome-shell; Hyprland needs one).
exec-once = lxpolkit

exec-once = waybar
exec-once = dunst
exec-once = hypridle
exec-once = hyprpaper
exec-once = nm-applet
# blueman's XDG autostart only fires in sessions that reach the systemd
# graphical-session.target (GNOME does, this session doesn't) — start explicitly.
exec-once = blueman-applet
# --silent: start in the background with just the tray icon, no window.
exec-once = 1password --silent
# "hide" keeps the main window closed at launch (tray-less CopyQ otherwise
# shows it on every start); the server still runs for $mod+c.
exec-once = copyq --start-server hide

# ── Media / hardware keys ─────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl  = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessDown, exec, brightnessctl --min-val=2 -q set 5%-
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -q set 5%+

# Screenshot (scrot → grim)
bind = , Print, exec, bash -c 'mkdir -p "$HOME/Pictures" && grim "$HOME/Pictures/screenshot-$(date +%Y-%m-%d-%H-%M-%S).png"'

# ── Apps ──────────────────────────────────────────────────────────────────────
bind = $mod, Return, exec, ghostty
# Focus-or-launch: checks the actual window list (not pgrep — a defunct
# zombie process with no window still matches by name and silently breaks
# this) and dispatches focus directly rather than relying on `&&`/`||`
# against hyprctl's exit code, which is always 0 regardless of match success.
bind = $mod SHIFT, Return, exec, bash -c 'hyprctl clients | grep -q "class: org.mozilla.firefox" && hyprctl dispatch focuswindow "class:^(org.mozilla.firefox)" || firefox'
bind = $mod SHIFT, q, killactive
bind = $mod, d, exec, rofi -show drun
bind = $mod, Tab, exec, rofi -show window
# Clipboard history (CopyQ runs tray-less: disable_tray=true in its own config)
bind = $mod, c, exec, copyq toggle

# Toggle night light (moderately warm screen, manual only)
bind = $mod SHIFT, n, exec, ~/.config/night-light-toggle.sh

# Lock now / lock-session (hypridle runs hyprlock on loginctl lock-session)
# Ctrl+Super+Q mirrors macOS's Ctrl+Cmd+Q; $mod+Shift+X kept as the original.
bind = $mod CTRL, q, exec, loginctl lock-session
bind = $mod SHIFT, x, exec, loginctl lock-session

# Re-apply monitor layout for the current hardware state
# (autorandr --change → hyprctl reload re-evaluates the monitor rules above).
bind = $mod SHIFT, m, exec, hyprctl reload

# ── Focus / move (i3 vim keys + arrows) ──────────────────────────────────────
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r
bind = $mod, Left,  movefocus, l
bind = $mod, Down,  movefocus, d
bind = $mod, Up,    movefocus, u
bind = $mod, Right, movefocus, r

bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, Left,  movewindow, l
bind = $mod SHIFT, Down,  movewindow, d
bind = $mod SHIFT, Up,    movewindow, u
bind = $mod SHIFT, Right, movewindow, r

# ── Splits / layout ───────────────────────────────────────────────────────────
# i3 "split h/v" → dwindle preselect for the next window.
bind = $mod, b, layoutmsg, preselect r
bind = $mod, v, layoutmsg, preselect d

bind = $mod, f, fullscreen

# i3 stacking/tabbed layouts → Hyprland groups (a group renders as tabs).
# $mod+w and $mod+s both toggle the group (Hyprland has no separate stacked
# mode); $mod+e leaves/toggles the split, as in i3.
bind = $mod, w, togglegroup
bind = $mod, s, togglegroup
bind = $mod, e, layoutmsg, togglesplit
# Cycle tabs inside a group with focus keys crossing group edges.
bind = $mod, g, changegroupactive, f

# Toggle tiling / floating
bind = $mod SHIFT, space, togglefloating
# i3's "focus mode_toggle" (jump between tiling and floating layers) has no
# exact Hyprland dispatcher; cyclenext floating focuses the floating layer,
# directional focus ($mod+h/j/k/l) crosses back.
bind = $mod, space, cyclenext, floating

# i3 "focus parent" has no Hyprland equivalent (no container tree).
# bind = $mod, a, ...

# Drag windows with $mod + mouse (i3 floating_modifier / tiling_drag)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Workspaces ────────────────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# move focused container to workspace (i3 default: don't follow)
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

# Jump back to previous workspace on repeated press
binds {
    workspace_back_and_forth = true
}

# ── Reload / exit ─────────────────────────────────────────────────────────────
# Hyprland reloads config live; both i3 "reload" and "restart" map to it.
bind = $mod SHIFT, c, exec, hyprctl reload && notify-send "Hyprland" "Config reloaded"
bind = $mod SHIFT, r, exec, hyprctl reload && notify-send "Hyprland" "Config reloaded"
bind = $mod SHIFT, e, exec, bash -c '[ "$(printf "No\nYes" | rofi -dmenu -p "Exit Hyprland?")" = "Yes" ] && hyprctl dispatch exit'

# ── Resize mode (i3 mode "resize" → Hyprland submap) ─────────────────────────
bind = $mod, r, submap, resize
submap = resize
binde = , h, resizeactive, -40 0
binde = , j, resizeactive, 0 40
binde = , k, resizeactive, 0 -40
binde = , l, resizeactive, 40 0
binde = , Left,  resizeactive, -40 0
binde = , Down,  resizeactive, 0 40
binde = , Up,    resizeactive, 0 -40
binde = , Right, resizeactive, 40 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mod, r, submap, reset
submap = reset

# ── Look & feel ───────────────────────────────────────────────────────────────
# Gaps match i3 (inner 10, outer 4 → Hyprland gaps_in is per-side).
general {
    gaps_in = 5
    gaps_out = 14
    border_size = 1
    # Muted pastel blue remains visible against virtually any dark surface.
    col.active_border = rgba(8a9199cc)
    col.inactive_border = rgba(30344299)
    layout = dwindle
    resize_on_border = true
}

dwindle {
    preserve_split = true
    # 0 (default) splits toward the mouse position; 2 = new window always
    # opens right/bottom, like i3.
    force_split = 2
}

group {
    col.border_active = rgba(8a9199cc)
    col.border_inactive = rgba(30344299)
    groupbar {
        font_family = Adwaita Sans
        font_size = 11
        col.active = rgb(7fb99a)
        col.inactive = rgb(1d202b)
        text_color = rgb(ececf1)
    }
}

# Rounding, blur and animations — replaces picom v13 entirely.
decoration {
    rounding = 12
    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = true
        new_optimizations = true
    }
    # macOS-style focus model paired with the subtle gray active border:
    # unfocused windows dim slightly, so focus reads as "the bright window".
    dim_inactive = true
    dim_strength = 0.12
    shadow {
        enabled = true
    }
    # Subtle blur trail on moving/resizing windows. Leave samples at Hyprland's
    # conservative default; increase only if the effect looks too subtle.
    motion_blur {
        enabled = true
    }
}

# Blur the wallpaper behind Waybar's translucent islands while ignoring the
# fully transparent remainder of its full-width layer surface.
layerrule {
    name = waybar-blur
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.20
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, easeOut, popin 90%
    animation = windowsOut, 1, 3, easeOut, popin 90%
    animation = fade, 1, 3, default
    animation = layersIn, 1, 2, easeOut, popin 90%
    animation = layersOut, 1, 2, easeOut, fade
    animation = workspaces, 1, 3, easeOut, slide
}

misc {
    font_family = Adwaita Sans
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Fullscreen surfaces scan out straight to the display, skipping the composite
# pass entirely (video, games). No effect on tiled/windowed rendering.
render {
    direct_scanout = true
}

# Crisp XWayland apps under fractional scale.
xwayland {
    force_zero_scaling = true
}

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
