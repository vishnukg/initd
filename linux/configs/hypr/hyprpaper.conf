# hyprpaper >= 0.8 — new block config format (the old `preload =` /
# `wallpaper = monitor,path` keywords are silently ignored by 0.8+).
# The wallpaper image is committed in the repo; empty monitor = all monitors.

splash = false

wallpaper {
    monitor =
    # The hypr config directory is managed as a symlink, so this sibling path
    # remains valid even when the repository is cloned outside ~/.config/initd.
    path = ~/.config/hypr/../wallpaper/wallpaper.jpg
    fit_mode = cover
}
