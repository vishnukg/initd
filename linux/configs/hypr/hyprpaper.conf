# hyprpaper >= 0.8 — new block config format (the old `preload =` /
# `wallpaper = monitor,path` keywords are silently ignored by 0.8+).
# The wallpaper image is committed in the repo; empty monitor = all monitors.

splash = false

wallpaper {
    monitor =
    # ~/.local/share/wallpapers is a MANAGED_LINKS entry pointing at
    # shared/wallpaper, so this resolves wherever the repo is cloned.
    path = ~/.local/share/wallpapers/abstract/emerald-twin-spheres-4k.png
    fit_mode = cover
}
