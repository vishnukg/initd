# hyprpaper >= 0.8 — new block config format (the old `preload =` /
# `wallpaper = monitor,path` keywords are silently ignored by 0.8+).
# The image comes from the vishnukg/wallpapers clone; empty monitor = all monitors.

splash = false

wallpaper {
    monitor =
    # A link to the current wallpaper, pre-scaled to the monitor, kept by
    # linux/scripts/wallpaper.mjs (the picker, $mod+SHIFT+w; rotation). It is
    # created before hyprpaper starts (hyprland.lua runs `wallpaper.mjs
    # ensure` first) and falls back to minimal/pastel-blue-glow.jpg from the
    # vishnukg/wallpapers clone in ~/.local/share/wallpapers.
    path = ~/.local/state/initd/wallpaper
    fit_mode = cover
}
