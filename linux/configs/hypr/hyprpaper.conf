# hyprpaper >= 0.8 — new block config format (the old `preload =` /
# `wallpaper = monitor,path` keywords are silently ignored by 0.8+).
# The image comes from the vishnukg/wallpapers clone; empty monitor = all monitors.

splash = false

wallpaper {
    monitor =
    # ~/.local/share/wallpapers is a clone of github.com/vishnukg/wallpapers,
    # kept in sync by linux/scripts/wallpapers.sh (bootstrap and update.sh).
    path = ~/.local/share/wallpapers/minimal/blue-mountain-green-sun.jpg
    fit_mode = cover
}
