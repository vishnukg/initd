# hyprlock: the current wallpaper, blurred and dimmed, a large clock, the date,
# a pill password field, the battery, and what is playing. Coloured by the
# wallpaper theme (linux/scripts/theme.mjs).
#
# Validated without locking anything: hyprlock parses its config before it
# connects to Wayland, so `hyprlock -c <file> --display wayland-none` prints
# any "Config error" and exits -- tests/linux/hyprlock-config.test.mjs runs
# exactly that against this file. A missing `source` is reported and skipped
# ("Proceeding ignoring faulty entries"), never fatal, and the defaults below
# stand in for any colour it would have set.

# Default palette; the theme file below overrides it when present.
$accent = rgba(8fb7e8ff)
$on_accent = rgba(0b0c10ff)
$text = rgba(e8eaf0ff)
$text_muted = rgba(aeb4c3ff)
$surface = rgba(14161dcc)
$bad = rgba(e0788aff)
source = ~/.local/state/initd/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    # Reveal the desktop immediately after successful authentication.
    animation = fadeOut, 0
}

background {
    monitor =
    # The current wallpaper, already scaled to the largest monitor
    # (linux/scripts/wallpaper.mjs keeps this link). Not a screenshot: even
    # blurred, one would show what was on screen to whoever is at the desk.
    path = ~/.local/state/initd/wallpaper
    blur_passes = 3
    blur_size = 10
    noise = 0.012
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.18
    vibrancy_darkness = 0.05
    color = rgb(0b0c12)
}

# Clock.
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 120
    font_family = Inter Display SemiBold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $text_muted
    font_size = 20
    font_family = Inter
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    rounding = -1
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $text
    inner_color = $surface
    font_color = $text
    check_color = $text
    fail_color = $bad
    fail_text = <i>Wrong password</i>
    placeholder_text = <span foreground="##aeb4c3">Password</span>
    fade_on_empty = false
    position = 0, -30
    halign = center
    valign = center
}

# What is playing, bottom centre; blank when nothing is. Every 5 s, and only
# while the screen is locked.
# No playerctl --format template: hyprlang reads {{ }} as an arithmetic
# expression (a config error that silently drops the label).
label {
    monitor =
    text = cmd[update:5000] playerctl metadata title >/dev/null 2>&1 && echo "󰎆   $(playerctl metadata artist 2>/dev/null)  ·  $(playerctl metadata title 2>/dev/null)" | cut -c1-90
    color = $text_muted
    font_size = 14
    font_family = Inter
    position = 0, 60
    halign = center
    valign = bottom
}

# Battery, top right.
label {
    monitor =
    text = cmd[update:30000] echo "󰁹  $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
    color = $text_muted
    font_size = 14
    font_family = Inter
    position = -40, -30
    halign = right
    valign = top
}
