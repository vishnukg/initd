# hyprlock — replaces the i3lock + lockscreen.sh/lockscreen-update.sh pipeline.
# No pre-rendered ~/.cache/lockscreen.png needed: hyprlock blurs the live
# screen itself. Colors match the old fallback (#1a1b2e, Tokyo Night dark).

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    color = rgb(1a1b2e)
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(7aa2f7)
    inner_color = rgb(1a1b2e)
    font_color = rgb(c0caf5)
    check_color = rgb(e0af68)
    fail_color = rgb(f7768e)
    placeholder_text = <span foreground="##565f89">password</span>
    fade_on_empty = true
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(c0caf5)
    font_size = 72
    font_family = FiraCode Nerd Font Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(565f89)
    font_size = 18
    font_family = FiraCode Nerd Font Mono
    position = 0, 40
    halign = center
    valign = center
}
