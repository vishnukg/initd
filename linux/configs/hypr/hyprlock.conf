# hyprlock — replaces the i3lock + lockscreen.sh/lockscreen-update.sh pipeline.
# No pre-rendered ~/.cache/lockscreen.png needed: hyprlock loads the desktop
# wallpaper directly and applies its own blur. Colors match Midnight Sage.

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    # ~/.local/share/wallpapers is a MANAGED_LINKS entry pointing at
    # shared/wallpaper, so this resolves wherever the repo is cloned.
    #
    # Deliberately the -3840 downscale, not the full 10500px scan hyprpaper
    # uses: this background is blurred to abstraction below, so the extra
    # detail is discarded either way, and hyprlock re-decodes on every lock
    # (2.56s -> 0.40s, measured). 3840x2303 still covers the largest display
    # in linux/configs/hyprmoncfg/profiles, so nothing upscales.
    path = ~/.local/share/wallpapers/classical-art/bierstadt-sierra-nevada-3840.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.95
    brightness = 0.60
    vibrancy = 0.12
    vibrancy_darkness = 0.05
    color = rgb(0b0c12)
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(9bcda7)
    inner_color = rgb(151720)
    font_color = rgb(ececf1)
    check_color = rgb(65d6ad)
    fail_color = rgb(ff6b7a)
    placeholder_text = <span foreground="##9299aa">password</span>
    fade_on_empty = true
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(ececf1)
    font_size = 72
    font_family = Berkeley Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(9299aa)
    font_size = 18
    font_family = Berkeley Mono
    position = 0, 40
    halign = center
    valign = center
}
