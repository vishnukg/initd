# hypridle — replaces xss-lock. Locks via hyprlock after 10 min idle, on
# loginctl lock-session and before suspend; turns displays off 30 s after the lock.

general {
    # Guarded: hypridle fires lock_cmd on every lock-session event, and a
    # hyprlock that fails to exit on unlock would otherwise leave one ~105 MB
    # process behind per suspend cycle (four had accumulated over four days).
    # `pidof` makes the lock idempotent — reuse the live instance if there is one.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

# Lock after 10 min idle, screen off 30 s later. Ordered this way so hyprlock
# is already drawn when the display wakes — a dark-but-unlocked session was
# the old i3 behaviour and is the gap this closes. loginctl lock-session goes
# through the same lock_cmd path as suspend, so there is one lock mechanism.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
