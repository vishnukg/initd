# hypridle — replaces xss-lock. Locks via hyprlock on loginctl lock-session
# and before suspend; turns displays off after 10 minutes idle.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Screen off after 10 min idle (no auto-lock — matches the old i3 setup,
# which only locked on suspend or an explicit $mod+Shift+x).
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
