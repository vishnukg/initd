# hypridle — replaces xss-lock. Idle steps: dim at 5 min, lock at 10, screen
# off 30 s after the lock, and on battery only, suspend at 20 min. The dim and
# suspend logic lives in linux/scripts/idle.sh (linked to ~/.config/idle.sh):
# hyprlang rewrites `$name` and `{{ }}` inside commands, so shell logic does
# not belong inline here. Every step is held off by an idle inhibitor --
# quick settings' "Keep awake", or a fullscreen video.

general {
    # Guarded: hypridle fires lock_cmd on every lock-session event, and a
    # hyprlock that fails to exit on unlock would otherwise leave one ~105 MB
    # process behind per suspend cycle (four had accumulated over four days).
    # `pidof` makes the lock idempotent — reuse the live instance if there is one.
    # Avoid resuming a partially transparent lock-screen fade-in after suspend.
    lock_cmd = pidof hyprlock || hyprlock --no-fade-in
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

# Dim to 20% after 5 min: the backlight is the biggest single draw on this
# laptop. Never brightens a screen already below 20%, and any input restores
# exactly the brightness it had (only if this step dimmed it).
listener {
    timeout = 300
    on-timeout = ~/.config/idle.sh dim
    on-resume = ~/.config/idle.sh undim
}

# Lock after 10 min idle, screen off 30 s later. Ordered this way so hyprlock
# is already drawn when the display wakes — a dark-but-unlocked session was
# the old i3 behaviour and is the gap this closes. loginctl lock-session goes
# through the same lock_cmd path as suspend, so there is one lock mechanism.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Suspend after 20 min idle, but only on battery and with no media playing:
# plugged in it never suspends (downloads, builds and the clamshell monitor
# setup keep running), and music does not stop just because nobody touched
# the keyboard. The session is already locked by then (the 10 min step).
listener {
    timeout = 1200
    on-timeout = ~/.config/idle.sh suspend-on-battery
}
