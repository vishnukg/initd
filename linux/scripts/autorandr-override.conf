# Installed to /etc/systemd/system/autorandr.service.d/initd.conf by
# linux/setup.sh. The packaged unit falls back to `--default default`, a
# profile that can't exist for a monitor we've never seen — so a brand-new
# monitor stayed dark. `clone-largest` mirrors the display instead; saved
# profiles still win whenever their EDID fingerprint matches.
[Service]
ExecStart=
ExecStart=/usr/bin/autorandr --batch --change --default clone-largest
