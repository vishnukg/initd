# Installed to /etc/systemd/system/autorandr-lid-listener.service.d/initd.conf
# by linux/setup.sh. Same pipeline as the packaged unit, with the fallback
# changed from `default` to `clone-largest` (see autorandr-override.conf) so
# closing the lid on an unrecognized monitor keeps that monitor lit.
[Service]
ExecStart=
ExecStart=sh -c "stdbuf -oL libinput debug-events | grep -E --line-buffered '^[[:space:]-]+event[0-9]+[[:space:]]+SWITCH_TOGGLE[[:space:]]' | while read line; do autorandr --batch --change --default clone-largest; done"
