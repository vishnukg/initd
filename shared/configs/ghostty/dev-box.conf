# Ghostty is the dev box terminal; kitty stays local. Linked to
# ~/.config/ghostty-dev-box.conf on personal machines only
# (shared/managed-links.sh) and pulled in by the shared config; a work machine
# gets no link, Ghostty skips the missing optional include, and stays local.
#
# Every window and tab runs ssh directly instead of the login shell, so the
# laptop's fish and tmux never start and the box's tmux is the only one. The
# window closes when the connection ends; the box's tmux keeps the session.
command = ssh dev
