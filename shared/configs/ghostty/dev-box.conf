# Ghostty is the dev box terminal; kitty stays local. Linked to
# ~/.config/ghostty-dev-box.conf on personal machines only
# (shared/managed-links.sh) and pulled in by the shared config; a work machine
# gets no link, Ghostty skips the missing optional include, and stays local.
#
# Every window and tab runs ssh without starting the login shell, so the
# laptop's fish and tmux never start and the box's tmux is the only one.
# Exit 255 (a connection dropped across sleep or a network blip) reconnects in
# place; a clean detach or last-window exit (0) breaks out and closes the
# window while the box's tmux keeps the session. ssh also exits 255 when it
# never connects (offline, or a dismissed 1Password approval), so the wait
# doubles from 1s to a 30s cap instead of retrying - and re-prompting - every
# second; a session that stayed up past 60s was a real one, so the next drop
# starts back at 1s. Ctrl-C during the wait closes the window.
#
# A dropped connection never lets the box's tmux turn off the modes it set:
# mouse tracking, focus reporting, bracketed paste, and extended keys. Ghostty
# keeps them on, so while the next ssh waits for 1Password, every mouse move,
# scroll, or focus change echoes as junk like ^[[<35;40;12M at the prompt. The
# printf turns those modes off after each exit (and leaves the alternate
# screen, so the reconnect message isn't drawn over the stale tmux screen).
command = sh -c 'd=1; while :; do t=$(date +%s); ssh dev; r=$?; printf "\033[?1000l\033[?1002l\033[?1003l\033[?1006l\033[?1004l\033[?2004l\033[>4;0m\033[<u\033[?1049l\033[?25h"; [ $r -eq 255 ] || break; [ $(($(date +%s) - t)) -gt 60 ] && d=1; echo "dev box: reconnecting in ${d}s"; sleep $d || break; d=$((d * 2)); [ $d -gt 30 ] && d=30; done'
