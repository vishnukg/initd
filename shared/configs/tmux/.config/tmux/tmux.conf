# Prefix: Ctrl+a
#
# Keep tmux in one explicit key namespace:
#   C-a <key> = tmux
#   \ <key>   = Neovim leader
#   C-w <key> = Neovim windows/splits
#
# If a program needs a real Ctrl+a, press C-a C-a.
unbind C-b
unbind C-Space
set -g prefix C-a
bind C-a send-prefix

# Windows
bind c new-window -c "#{pane_current_path}"
bind Tab next-window
bind BTab previous-window
# n / p / , (rename) / s (session tree) / z (zoom) are tmux defaults.

# Splits (open in current path)
bind b  split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Pane navigation. Use the prefix so these never steal keys from Neovim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing. C-a e enters resize mode; h/j/k/l adjust freely; Escape exits.
bind e switch-client -T resize
bind -T resize h      resize-pane -L 5 \; switch-client -T resize
bind -T resize j      resize-pane -D 5 \; switch-client -T resize
bind -T resize k      resize-pane -U 5 \; switch-client -T resize
bind -T resize l      resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root

# Handy pane/window management.
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
# Agents (see agent-state.sh): C-a a jumps to the agent that has waited on you
# longest; C-a g ("go") lists every agent, blocked first, with a live preview.
# g replaces tmux 3.8's stock "move floating pane" table, unused here.
bind a run-shell "~/.config/tmux/agent-state.sh next '#{client_name}' '#{pane_id}'"
bind g display-popup -E -w 80% -h 70% -b rounded -T "#[fg=#{@c-green},bold] agents " "~/.config/tmux/agent-state.sh pick"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -sg escape-time 0
set -g history-limit 50000
setw -g mode-keys vi
set -g mouse on
set -g focus-events on

# Killing the last window of a session jumps to another live session instead
# of dropping out of tmux altogether.
set -g detach-on-destroy off

# Let the terminal (kitty/Ghostty) title follow tmux: "session · window".
# Hyprland's window switcher and kitty's tab bar then read like the status
# line does.
set -g set-titles on
set -g set-titles-string "#S · #W"

# Pass the kitty keyboard protocol through, so Neovim inside tmux can tell
# e.g. Ctrl+Shift+<key> and Ctrl+<punctuation> apart. Needs the outer
# terminal to advertise extkeys (declared in terminal-features below).
set -s extended-keys on

# Let escape sequences such as kitty's image protocol reach the terminal.
set -g allow-passthrough on

# True color
# Fixed array indexes (not -a appends) so C-a r reloads stay idempotent
# instead of stacking duplicate entries until the server restarts.
set -g default-terminal "tmux-256color"
set -s terminal-overrides[100] "xterm-256color:Tc"
# sync: synchronized updates (DEC 2026). Both terminals implement it but
# neither advertises it in terminfo, so tmux would never use it. With it, tmux
# wraps each redraw so the terminal paints a complete frame instead of a
# stream of partial ones - which is what Claude Code (Ink; it emits ?2026
# itself) and any full-screen TUI need to not tear or flicker inside tmux.
# clipboard/focus/title come from tmux's built-in xterm* entry, which matches
# both terminal names.
set -s terminal-features[100] "xterm-ghostty:RGB:extkeys:sync"
set -s terminal-features[101] "xterm-kitty:RGB:extkeys:sync"
set-environment -g COLORTERM truecolor

# Copy to the system clipboard via OSC 52 (kitty and ghostty support it);
# also lets programs inside tmux (nvim) set the clipboard, including over ssh.
set -s set-clipboard on

# --- Palette: the one place colours are defined ---
# Everything reads these @c-* options: formats here refer to #{@c-name}, the
# plain style options below use set -F (expanded when the line is applied, so
# C-a r picks up an edit), the watcher's pills (status-renderer.mjs) emit
# #{@c-name} that status-right expands, and agent-state.sh asks tmux for them.
set -g @c-pill     "#111116"  # pill and tab background
set -g @c-text     "#9aa5ce"  # pill values, inactive tabs, picker text
set -g @c-fg       "#dcd7ba"  # status and message text
set -g @c-green    "#4ec994"  # accent: active tab and border, done, battery
set -g @c-green-bg "#1c3a2e"  # message bar and picker selection
set -g @c-red      "#f7768e"  # blocked agent, Codex
set -g @c-amber    "#e0af68"  # working agent, Claude
set -g @c-blue     "#7aa2f7"  # Copilot
set -g @c-purple   "#bb9af7"  # session name, git branch, search matches
set -g @c-muted    "#727169"  # secondary text
set -g @c-border   "#1a1a22"  # inactive pane borders, picker lines
set -g @c-black    "#000000"  # popup background
set -g @c-ink      "#141414"  # text on the green copy-mode selection

# Pane borders
set -gF pane-border-style "fg=#{@c-border}"
set -gF pane-active-border-style "fg=#{@c-green}"
set -gF display-panes-colour "#{@c-muted}"
set -gF display-panes-active-colour "#{@c-green}"

set -g status on
# 1s, not the default 15: the window tabs show #{pane_current_command}, which
# is only re-read when the status line redraws - the current window's tab
# stays on the old program until the next interval tick.
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -gF status-style "bg=default,fg=#{@c-fg}"

set -g status-left-length 40
set -g status-left "#[fg=#{@c-pill},bg=default]#[bg=#{@c-pill},fg=#{@c-purple},bold] @ #S #[bg=default,fg=#{@c-pill}] "

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Give each new window a random emoji and each numbered session a space name
# (names.sh: bash, ~10ms); seed existing ones on config reload. -b: run in the
# background so the window is usable immediately; the emoji lands on the next
# status redraw (≤1s) instead of gating creation.
set-hook -g after-new-window  'run-shell -b "~/.config/tmux/names.sh"'
set-hook -g after-new-session 'run-shell -b "~/.config/tmux/names.sh"'
run-shell -b "~/.config/tmux/names.sh"

# Tab name: the live pane command (re-evaluated on every status redraw, so it
# updates instantly), falling back to the manual name once a window is renamed
# (rename-window turns automatic-rename off for that window). Going through
# #{window_name} alone would wait on tmux's name timer - laggy.
set -g window-status-separator " "
# tmux 3.8 defaults the current-window style to underscore, which draws an
# underline under the active tab; the green/bold format below already marks it.
set -g window-status-current-style default
# Agent state dot, set by Claude Code hooks through agent-state.sh. A window
# shows its most urgent pane, so a blocked agent in a background split still
# surfaces, all bold Nerd Font icons: red nf-md-alert_circle blocked (waiting on
# you) > amber nf-md-timer_sand working > green nf-md-check_bold done.
# The claude test hides state left behind by an agent that died before its
# SessionEnd hook ran.
set -g @agent-states "#{P:#{?#{==:#{pane_current_command},claude},#{@agent-state},} }"
set -g @agent-dot "#{?#{m:*blocked*,#{E:@agent-states}},#[fg=#{@c-red}]#[bold]\U000F0028 #[nobold],#{?#{m:*working*,#{E:@agent-states}},#[fg=#{@c-amber}]#[bold]\U000F051F #[nobold],#{?#{m:*done*,#{E:@agent-states}},#[fg=#{@c-green}]#[bold]\U000F012C #[nobold],}}}"
# Arriving at a pane (switching to it, or refocusing the terminal on it) marks
# its finished agent as seen. agent-state.sh handles the other half: an agent
# that finishes while you are already looking skips "done" entirely.
set-hook -g pane-focus-in 'if-shell -F "#{==:#{@agent-state},done}" "set-option -pu @agent-state ; set-option -pu @agent-since"'
set -g window-status-format        "#[fg=#{@c-pill},bg=default]#[fg=#{@c-text},bg=#{@c-pill}] #{E:@agent-dot}#[fg=#{@c-text}]#I:#{?#{automatic-rename},#{pane_current_command},#{window_name}}:#{b:pane_current_path}:#{@emoji} #[fg=#{@c-pill},bg=default]"
set -g window-status-current-format "#[fg=#{@c-pill},bg=default]#[fg=#{@c-green},bg=#{@c-pill},bold] #{E:@agent-dot}#[fg=#{@c-green}]#[bold]#I:#{?#{automatic-rename},#{pane_current_command},#{window_name}}:#{b:pane_current_path}:#{@emoji} #[fg=#{@c-pill},bg=default,nobold]"

set -g status-right-length 110
# Right side: [agent states, all sessions] [git branch] [pane's agent/model and
# quota] [battery].
# The watcher job reads agent metadata directly from local sessions. tmux keys
# #() jobs per CLIENT, so a second terminal on this server starts a second
# watcher - that is tmux, not something this config can turn off. They elect one
# worker between them through a lock in the cache dir (see tmux.mjs); the others
# idle, which is why this job output is blank and every pill below is an option.
# Changed watcher code restarts itself; keep this command stable across reloads.
# @initd-agent-pill is set per pane by the watcher, and status-right expands in
# the current pane's context, so this reads the right pane's value with no job
# to spawn - one less node process per redraw, and no ambiguity about which
# pane is "active" when several windows each have one.
#
# Do NOT add `refresh-client -S` to make the bar repaint faster. It re-runs
# every #() in the status line, including the watcher below, so the watcher is
# torn down and restarted on each call - measured: a new pid every second, with
# its quota and transcript caches lost each time. A forced redraw and a
# long-lived status job cannot coexist; status-interval is the redraw floor.
#
# --max-semi-space-size=1 caps V8's young generation. Each tick parses a full
# `ps` table (~150 KB) while an agent pane is open, and that churn grows the
# young generation to its ceiling, which V8 then never returns: measured 134 MB
# of new space holding ~5 MB of live data, 165 MB RSS. Capped, it is 70 MB RSS
# at the same 44 ms tick.
#
# The first pill counts agents in each state across EVERY session - the tab
# icons only cover this one - using the same icons and colours: blocked,
# working, done. A state at zero is left out, and the pill disappears when no
# agent is running. Each @agent-<state> loop yields one "x" per matching pane,
# so #{n:} is the count. Format loops only, no job. Styles are split into one
# #[] per attribute because a comma inside #{?...} ends the branch.
set -g @agent-blocked "#{S:#{W:#{P:#{?#{&&:#{==:#{pane_current_command},claude},#{==:#{@agent-state},blocked}},x,}}}}"
set -g @agent-working "#{S:#{W:#{P:#{?#{&&:#{==:#{pane_current_command},claude},#{==:#{@agent-state},working}},x,}}}}"
set -g @agent-done "#{S:#{W:#{P:#{?#{&&:#{==:#{pane_current_command},claude},#{==:#{@agent-state},done}},x,}}}}"
set -g @agent-pill "#{?#{E:@agent-blocked}#{E:@agent-working}#{E:@agent-done},#[fg=#{@c-pill}]#[bg=default]\uE0B6#[bg=#{@c-pill}]#{?#{E:@agent-blocked}, #[fg=#{@c-red}]#[bold]\U000F0028 #[nobold]#[fg=#{@c-text}]#{n:#{E:@agent-blocked}},}#{?#{E:@agent-working}, #[fg=#{@c-amber}]#[bold]\U000F051F #[nobold]#[fg=#{@c-text}]#{n:#{E:@agent-working}},}#{?#{E:@agent-done}, #[fg=#{@c-green}]#[bold]\U000F012C #[nobold]#[fg=#{@c-text}]#{n:#{E:@agent-done}},} #[fg=#{@c-pill}]#[bg=default]\uE0B4 ,}"
set -g status-right "#{E:@agent-pill}#{E:@initd-git-pill}#{E:@initd-agent-pill}#{E:@initd-battery}#(node --max-semi-space-size=1 ~/.config/tmux/tmux.mjs watch)"

set -gF message-style "bg=#{@c-green-bg},fg=#{@c-fg}"
set -gF message-command-style "bg=#{@c-green-bg},fg=#{@c-green}"
set -gF mode-style "bg=#{@c-green},fg=#{@c-ink}"
# tmux 3.8 themes popups dark grey (bg=themedarkgrey); black matches the
# terminal. fzf in the C-a g picker uses bg:-1, so it inherits this.
set -gF popup-style "bg=#{@c-black},fg=#{@c-fg}"
set -gF popup-border-style "bg=#{@c-black},fg=#{@c-green}"

set -gF clock-mode-colour "#{@c-green}"
set -g clock-mode-style 24

# Mouse wheel: the root-table binds are deliberately tmux's defaults. Stock
# WheelUpPane checks #{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}:
# programs that handle the mouse (nvim, fzf) get the event, alternate-screen
# programs that don't (less, man, git log) get it translated to arrow keys,
# and a plain shell enters copy-mode. A custom bind here once dropped the
# alternate_on test, which sent pagers into copy-mode instead of scrolling
# them. Once in copy-mode the copy-mode-vi table below owns the wheel.
# Restated here (and WheelDownPane explicitly unbound) so a C-a r reload
# converges on this state rather than keeping whatever was bound before.
bind -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }
unbind -n WheelDownPane

# Smooth scroll in copy mode (2 lines per tick instead of the default 5)
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# Copy to system clipboard (set-clipboard handles the OSC 52 write)
bind -T copy-mode-vi y     send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# v starts a selection like vim, not tmux's default rectangle-toggle.
# C-v still toggles rectangle mode (tmux binds it there too by default).
bind -T copy-mode-vi v send -X begin-selection
