# Prefix: Ctrl+a
#
# Keep tmux in one explicit key namespace:
#   C-a <key> = tmux
#   \ <key>   = Neovim leader
#   C-w <key> = Neovim windows/splits
#
# If a program needs a real Ctrl+a, press C-a C-a.
unbind C-b
unbind C-Space
set -g prefix C-a
bind C-a send-prefix

# Windows
bind c new-window -c "#{pane_current_path}"
bind Tab next-window
bind BTab previous-window
bind n next-window
bind p previous-window
bind , command-prompt -I "#W" "rename-window '%%'"

# Sessions
bind s choose-tree -s

# Splits (open in current path)
bind b  split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Pane navigation. Use the prefix so these never steal keys from Neovim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing. C-a e enters resize mode; h/j/k/l adjust freely; Escape exits.
bind e switch-client -T resize
bind -T resize h      resize-pane -L 5 \; switch-client -T resize
bind -T resize j      resize-pane -D 5 \; switch-client -T resize
bind -T resize k      resize-pane -U 5 \; switch-client -T resize
bind -T resize l      resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root

# Handy pane/window management.
bind z resize-pane -Z
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -sg escape-time 0
set -g history-limit 50000
setw -g mode-keys vi
set -g mouse on
set -g focus-events on
set -g repeat-time 200

# True color
# Fixed array indexes (not -a appends) so C-a r reloads stay idempotent
# instead of stacking duplicate entries until the server restarts.
set -g default-terminal "tmux-256color"
set -s terminal-overrides[100] "xterm-256color:Tc"
set -s terminal-features[100] "xterm-ghostty:RGB"
set-environment -g COLORTERM truecolor

# Copy to the system clipboard via OSC 52 (ghostty supports it); also lets
# programs inside tmux (nvim) set the clipboard, including over ssh.
set -s set-clipboard on
set -s terminal-features[101] "xterm-ghostty:clipboard"

# --- Dark Green theme ---
# Active tab / session pill: bg=#1c3a2e  fg=#4ec994
# Inactive tab:              bg=#111116  fg=#9aa5ce
# Info pills:                bg=#111116  fg=#9aa5ce

# Pane borders
set -g pane-border-style "fg=#1a1a22"
set -g pane-active-border-style "fg=#4ec994"
set -g display-panes-colour "#727169"
set -g display-panes-active-colour "#4ec994"

set -g status on
# 1s, not the default 15: the window tabs show #{pane_current_command}, which
# is only re-read when the status line redraws - the current window's tab
# stays on the old program until the next interval tick.
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#dcd7ba"

set -g status-left-length 40
set -g status-left "#[fg=#111116,bg=default]#[bg=#111116,fg=#bb9af7,bold] @ #S #[bg=default,fg=#111116] "

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Assign a random emoji to each new window; seed existing windows on config reload.
# -b: run in the background so the new window is usable immediately; the
# emoji lands on the next status redraw (≤1s) instead of gating creation.
set-hook -g after-new-window  'run-shell -b "~/.config/tmux/random-emoji.sh #{window_id}"'
set-hook -g after-new-session 'run-shell -b "~/.config/tmux/random-emoji.sh #{window_id}"'
run-shell "tmux list-windows -a -F '#{window_id}' 2>/dev/null | xargs -I{} ~/.config/tmux/random-emoji.sh {}"

# Tab name: the live pane command (re-evaluated on every status redraw, so it
# updates instantly), falling back to the manual name once a window is renamed
# (rename-window turns automatic-rename off for that window). Going through
# #{window_name} alone would wait on tmux's name timer - laggy.
set -g window-status-separator " "
set -g window-status-format        "#[fg=#111116,bg=default]#[fg=#9aa5ce,bg=#111116] #I:#{?#{automatic-rename},#{pane_current_command},#{window_name}}:#{b:pane_current_path}:#{@emoji} #[fg=#111116,bg=default]"
set -g window-status-current-format "#[fg=#111116,bg=default]#[fg=#4ec994,bg=#111116,bold] #I:#{?#{automatic-rename},#{pane_current_command},#{window_name}}:#{b:pane_current_path}:#{@emoji} #[fg=#111116,bg=default,nobold]"

set -g status-right-length 90
# Right side: [git branch] [battery] [date time].
# git-branch.sh prints its whole pill (styles included) or nothing, so the
# pill vanishes outside a repo; it runs once per 1s redraw (~1 ms: one file
# read via symbolic-ref, no `git status`). battery.sh stays alive and emits a
# new value every 30s - tmux keeps its latest line for each 1s redraw instead
# of starting a new battery process each time.
set -g status-right "#(~/.config/tmux/git-branch.sh \"#{pane_current_path}\")#[fg=#111116,bg=default]#[fg=#4ec994,bg=#111116,bold] 󰁹 #[fg=#9aa5ce]#(~/.config/tmux/battery.sh) #[fg=#111116,bg=default,nobold] #[fg=#111116,bg=default]#[fg=#7aa2f7,bg=#111116,bold] 󰃭 #[fg=#9aa5ce]%d %b  %H:%M #[fg=#111116,bg=default,nobold]"

set -g message-style "bg=#1c3a2e,fg=#dcd7ba"
set -g message-command-style "bg=#1c3a2e,fg=#4ec994"
set -g mode-style "bg=#4ec994,fg=#141414"

set -g clock-mode-colour "#4ec994"
set -g clock-mode-style 24

# Mouse scroll — pass to pane if it handles mouse (nvim, fzf), else enter copy-mode
bind -n WheelUpPane   if-shell -F "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -X -N 2 scroll-up'   'copy-mode -e'"
bind -n WheelDownPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -X -N 2 scroll-down' ''"

# Smooth scroll in copy mode (2 lines per tick instead of the default 5)
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# Copy to system clipboard (set-clipboard handles the OSC 52 write)
bind -T copy-mode-vi y     send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# v starts a selection like vim, not tmux's default rectangle-toggle.
# C-v still toggles rectangle mode (tmux binds it there too by default).
bind -T copy-mode-vi v send -X begin-selection
