# Prefix: Ctrl+a
#
# Keep tmux in one explicit key namespace:
#   C-a <key> = tmux
#   \ <key>   = Neovim leader
#   C-w <key> = Neovim windows/splits
#
# If a program needs a real Ctrl+a, press C-a C-a.
unbind C-b
unbind C-Space
set -g prefix C-a
bind C-a send-prefix

# Windows
bind c new-window -c "#{pane_current_path}"
bind Tab next-window
bind BTab previous-window
bind n next-window
bind p previous-window
bind , command-prompt -I "#W" "rename-window '%%'"

# Sessions
bind s choose-tree -s

# Splits (open in current path)
bind b  split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Pane navigation. Use the prefix so these never steal keys from Neovim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing. C-a e enters resize mode; arrow keys adjust freely; Escape exits.
bind e switch-client -T resize
bind -T resize h      resize-pane -L 5 \; switch-client -T resize
bind -T resize j      resize-pane -D 5 \; switch-client -T resize
bind -T resize k      resize-pane -U 5 \; switch-client -T resize
bind -T resize l      resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root

# Handy pane/window management.
bind z resize-pane -Z
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -sg escape-time 0
set -g history-limit 10000
setw -g mode-keys vi
set -g mouse on
set -g focus-events on
set -g repeat-time 200

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"
set -as terminal-features "xterm-ghostty:RGB"
set-environment -g COLORTERM truecolor

# --- VSCode Dark — Pastel Green accent (matches Kitty) ---
# Active green: #4ec994   Inactive bg: #24283b
# Inactive text: #7aa2f7  Active text: #141414

# Pane borders
set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#4ec994"
set -g display-panes-colour "#727169"
set -g display-panes-active-colour "#4ec994"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#dcd7ba"

set -g status-left-length 40
set -g status-left "#[fg=#1e1a2e,bg=default]#[bg=#1e1a2e,fg=#bb9af7,bold] 📂 #S #[bg=default,fg=#1e1a2e] "

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Assign a random emoji to each new window; seed existing windows on config reload.
set-hook -g after-new-window  'run-shell "~/.config/tmux/random-emoji.sh #{window_id}"'
set-hook -g after-new-session 'run-shell "~/.config/tmux/random-emoji.sh #{window_id}"'
run-shell "tmux list-windows -a -F '#{window_id}' 2>/dev/null | xargs -I{} ~/.config/tmux/random-emoji.sh {}"

set -g window-status-separator " "
set -g window-status-format        "#[fg=#1a1a22,bg=default]#[fg=#9aa5ce,bg=#1a1a22] #I:#{window_name}:#{b:pane_current_path}:#{@emoji} #[fg=#1a1a22,bg=default]"
set -g window-status-current-format "#[fg=#1e1a2e,bg=default]#[fg=#bb9af7,bg=#1e1a2e,bold] #I:#{window_name}:#{b:pane_current_path}:#{@emoji} #[fg=#1e1a2e,bg=default,nobold]"

set -g status-right-length 55
set -g status-right "#[fg=#1a1a22,bg=default]#[fg=#9aa5ce,bg=#1a1a22,bold] 🔋 #(pmset -g batt | grep -o '[0-9]*%%' | head -1)  📅 %d %b %H:%M #[fg=#1a1a22,bg=default]"

set -g message-style "bg=#24283b,fg=#dcd7ba"
set -g message-command-style "bg=#24283b,fg=#4ec994"
set -g mode-style "bg=#4ec994,fg=#141414"

set -g clock-mode-colour "#4ec994"
set -g clock-mode-style 24

# Mouse scroll — pass to pane if it handles mouse (nvim, fzf), else enter copy-mode
bind -n WheelUpPane   if-shell -F "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' ''"

# Copy to system clipboard
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Escape send -X cancel
