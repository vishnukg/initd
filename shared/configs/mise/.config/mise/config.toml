[settings]
experimental              = true            # required for dotnet: backend (roslyn-language-server, csharpier)
github.credential_command = "gh auth token" # use gh CLI for GitHub auth instead of a stored token
minimum_release_age       = "8h"            # wait eight hours before accepting new releases
# Install pipx: tools with uv instead of pipx. uv builds their venvs against
# its own managed pythons (~/.local/share/uv), which mise upgrades never
# delete — so python patch bumps can't orphan the yamllint venv again.
pipx.uvx                  = true

[env]
# Make uv build pipx: tool venvs against its own downloaded pythons
# (~/.local/share/uv/python) instead of whatever python is on PATH. mise
# never deletes uv's pythons, so repinning/upgrading [tools].python can't
# break these venvs.
UV_MANAGED_PYTHON = "1"

[tools]
# ── runtimes ───────────────────────────────────────────────────────────
uv        = "latest"              # required for pipx: backend with pipx.uvx (yamllint)
dotnet    = ["latest", "8"]
go        = "latest"
node      = "lts"
npm       = "latest"
python    = "latest"
terraform = "latest"
yarn      = ["latest", "1.22.22"]

# ── LSP servers (consumed by nvim/.../user/lsp/servers.lua) ────────────
"lua-language-server"                   = "latest" # lua_ls
# TypeScript 7 (native Go rewrite) ships its own LSP server (`tsc --lsp`),
# replacing tsserver + typescript-language-server. nvim's settings/tsgo.lua
# points at this install's bin/tsc.
"npm:typescript"                        = "latest" # tsgo
"npm:pyright"                           = "latest"
"ruff"                                  = "latest" # ruff LSP — python lint + format + imports
"go:golang.org/x/tools/gopls"           = "latest"
"terraform-ls"                          = "latest" # terraformls
"npm:vscode-langservers-extracted"      = "latest" # html, jsonls, cssls
"npm:bash-language-server"              = "latest" # bashls
"npm:yaml-language-server"              = "latest" # yamlls
"npm:emmet-ls"                          = "latest" # emmet_ls
"npm:dockerfile-language-server-nodejs" = "latest" # dockerls
# Microsoft's official Roslyn LSP (same engine as VS Code's C# extension).
# Prerelease-only versioning is normal — the package tracks Roslyn's CI feed.
"dotnet:roslyn-language-server"         = "latest" # roslyn_ls

# ── CLI tools ──────────────────────────────────────────────────────────
"neovim"                 = "latest"
"ast-grep"               = "latest" # structural search; extends grug-far
"delta"                  = "latest" # git-delta
"fd"                     = "latest"
"fzf"                    = "latest"
"glow"                   = "latest"
"lazygit"                = "latest"
"npm:npm-check-updates"  = "latest" # ncu — bump package.json deps past semver ranges
"ripgrep"                = "latest"
"starship"               = "latest"
"zoxide"                 = "latest"
"github:openfga/openfga" = "latest"
"tree-sitter"         = "latest" # required by nvim treesitter parser compilation
"claude-code"            = "latest" # native binary via mise registry; the npm package needs a postinstall step mise doesn't run
"aqua:openai/codex"      = "latest" # prebuilt binary from GitHub releases, not the npm wrapper

# ── linters / formatters (consumed by nvim/.../user/lsp/null-ls.lua) ───
"stylua"                                   = "latest"
"hadolint"                                 = "latest"
"golangci-lint"                            = "latest"
"go:github.com/mgechev/revive"             = "latest"
"go:github.com/google/yamlfmt/cmd/yamlfmt" = "latest"
"go:golang.org/x/tools/cmd/goimports"      = "latest"
"npm:stylelint"                            = "latest"
"npm:eslint_d"                             = "latest"
"npm:@fsouza/prettierd"                    = "latest"
"pipx:yamllint"                            = "latest"
"dotnet:csharpier"                         = "latest"
"taplo"                                    = "latest" # toml formatter
"github:github/copilot-cli"     = "latest" # GitHub Copilot CLI
