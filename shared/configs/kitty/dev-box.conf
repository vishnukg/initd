# The remote dev box shortcuts, linked to ~/.config/kitty-dev-box.conf on
# personal machines only (shared/managed-links.sh) and pulled in by kitty.conf.
# A work machine gets no link, and kitty skips the missing include.
#
# The box (Host `dev` in ~/.ssh/config, also personal-only) opens in its own OS
# window. kitty runs ssh directly, not through fish, so the laptop's tmux never
# auto-attaches and the box's tmux is the only status line. `ssh dev` typed
# inside the local tmux nests instead: two status lines, and both tmuxes on the
# same C-a prefix (the inner one then needs C-a C-a).
map ctrl+shift+d               launch --type=os-window ssh dev
map super+shift+d              launch --type=os-window ssh dev
