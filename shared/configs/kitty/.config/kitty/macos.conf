# macOS window decorations — pulled in from kitty.conf via `include ${KITTY_OS}.conf`.
# Ghostty equivalent: macos-titlebar-style = transparent.
#
# Minimal titlebar that keeps the traffic-light buttons: the bar stays but is
# painted with the terminal background, and the title text moves to the
# menubar, so all that reads as chrome is the three buttons.
# hide_window_decorations titlebar-only is NOT an option here — it removes the
# buttons together with the bar.
hide_window_decorations        no
macos_titlebar_color           background
macos_show_window_title_in     menubar

# --- Fonts (macOS override) ---
# CoreText exposes the patched non-Mono family as non-monospace, so kitty does
# not offer it as a text face. Use plain Fira Code for text and route Nerd Font
# codepoints to the standalone non-Mono Symbols Nerd Font. This preserves the
# natural-width icons of the non-Mono patched build without falling back to
# Menlo. Pin PostScript names because family/style matching is unreliable for
# Fira Code's Retina weight. Fira Code has no italic face, so italic
# intentionally reuses the upright Retina/Bold faces.
# Verify with `kitty --debug-font-fallback`.
font_family      postscript_name=FiraCode-Retina features="-liga -calt"
bold_font        postscript_name=FiraCode-Bold   features="-liga -calt"
italic_font      postscript_name=FiraCode-Retina features="-liga -calt"
bold_italic_font postscript_name=FiraCode-Bold   features="-liga -calt"
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Symbols Nerd Font

# "platform" is the default, pinned deliberately: on macOS it reproduces Core
# Text's rendering including Apple's stem darkening — the native-Mac text look.
# (Supersedes the old macos_thicken_font knob; do not reintroduce that.)
text_composition_strategy      platform
