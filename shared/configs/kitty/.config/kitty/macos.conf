# macOS window decorations — pulled in from kitty.conf via `include ${KITTY_OS}.conf`.
# Ghostty equivalent: macos-titlebar-style = transparent.
#
# Minimal titlebar that keeps the traffic-light buttons: the bar stays but is
# painted with the terminal background, and the title text moves to the
# menubar, so all that reads as chrome is the three buttons.
# hide_window_decorations titlebar-only is NOT an option here — it removes the
# buttons together with the bar.
hide_window_decorations        no
macos_titlebar_color           background
macos_show_window_title_in     menubar

# Fonts live in the shared kitty.conf: Berkeley Mono resolves cleanly on both
# backends, so no macOS-specific font override is needed. (A macOS override was
# needed in the FiraCode era because kitty's CoreText backend rejects patched
# Nerd Font builds — see the fonts comment in kitty.conf. That restriction is
# still live; it is why Ghostty, not kitty, is the terminal running FiraCode
# Nerd Font today. Move kitty back to a patched build and the pin returns.)

# "platform" is the default, pinned deliberately: on macOS it reproduces Core
# Text's rendering including Apple's stem darkening — the native-Mac text look.
# (Supersedes the old macos_thicken_font knob; do not reintroduce that.)
text_composition_strategy      platform

# Top padding only. The shared kitty.conf sets 12 on all four edges, which is
# right on Linux (no titlebar there — linux.conf runs titlebar-only). On macOS
# the titlebar is kept and painted in `background`, so its ~28px stacks on top
# of the padding and leaves ~40px of empty background above row 1 against 12px
# at the left edge. The titlebar is already that gap, so the top edge gets 0
# and row 1 sits directly beneath it. Order is CSS: top right bottom left.
window_padding_width           0 12 12 12
