# kitty — the default terminal on both platforms. Ghostty is kept installed as a
# fallback (Linux: SUPER+SHIFT+ALT+Return); the two configs are kept in sync.
#
# Deliberately has NO split or tab bindings. tmux owns that layer — C-a b/v to
# split, C-a h/j/k/l to move, C-a e to resize, C-a z to zoom, C-a c and Tab for
# windows — and tmux panes survive the terminal dying, which terminal-native
# splits do not. That stopped being hypothetical the day restarting the Ghostty
# server closed every window and the tmux sessions came back untouched.
#
# Shared with macOS. Anything Linux-only is passed as `-o key=value` at launch
# (see linux/configs/hypr/hyprland.lua) rather than written here.

# --- Core Settings ---
# Ghostty's scrollback-limit is bytes (10 MB); kitty's is lines. 20000 lines is
# the rough equivalent. scrollback_pager_history_size is the separate on-disk
# buffer the pager can reach, in MB.
scrollback_lines               20000
scrollback_pager_history_size  10

window_padding_width           0
confirm_os_window_close        0

# Ghostty: shell-integration = fish / shell-integration-features = no-cursor.
# kitty detects the shell itself; no-cursor keeps it from managing cursor shape.
shell_integration              enabled no-cursor

# Ghostty: bell-features = no-system,no-audio,no-attention,no-title,no-border
enable_audio_bell              no
visual_bell_duration           0
window_alert_on_bell           no
bell_on_tab                    no

cursor_shape                   block
cursor_blink_interval          0
cursor                         #ffffff
cursor_text_color              #141414

# --- Fonts ---
# Berkeley Mono — licensed; shared/fonts/ is a gitignored clone of the PRIVATE
# vishnukg/fonts repo, synced by shared/lib/fonts.sh at bootstrap (macOS then
# copies it in via ensure_local_fonts, Linux links it into
# ~/.local/share/fonts). It is a real text font, not one of the patched Nerd
# Font builds — those kitty's CoreText backend silently rejects (falling back
# to Menlo) because their double-width icon glyphs fail its monospace
# validation, which is why none is set as the text font here. On a machine
# without the font installed, kitty falls back to the platform default (Menlo /
# fontconfig's pick) — `gh auth login`, then re-run bootstrap (or
# shared/lib/fonts.sh) to fetch and install it.
#
# Because Berkeley resolves cleanly on BOTH backends, this block is shared:
# macos.conf carries no font override at all, unlike the FiraCode era.
#
# The faces are addressed by postscript_name rather than family/style, because
# family/style matching is unreliable here on BOTH backends and fails silently
# — kitty picks some other installed monospace and logs nothing.
#
#   * Only BerkeleyMono-Regular.otf stores its advance widths in the compressed
#     hmtx form (numberOfHMetrics=1). Every other face carries per-glyph metrics
#     in which a handful of glyphs out of 645 deviate from the 600 unit width,
#     so fontconfig scans them, concludes "not monospace", and leaves spacing
#     unset. kitty's fontconfig backend queries :spacing=100 for text faces, so
#     bold/italic/bold-italic were resolving to FiraCode Nerd Font while Regular
#     rendered correctly. linux/configs/fontconfig/fonts.conf forces the family
#     to spacing=100 at scan time; that rule is required IN ADDITION to the
#     postscript_name descriptors below, since without it the faces are invisible
#     to fontconfig-based matching no matter how they are addressed.
#   * The oblique faces are not RIBBI-paired: BerkeleyMono-Oblique.otf sets name
#     ID 1 to "Berkeley Mono Oblique" with subfamily "Regular", and only the
#     typographic names (16/17) say "Berkeley Mono" / "Oblique". fontconfig
#     merges both, so style="Oblique" matches on Linux; CoreText keys off name
#     ID 1, so on macOS the "Berkeley Mono" family plausibly holds only Regular
#     and Bold and the italic lines would find no such style.
#
# Note the PostScript names contract "Bold-Oblique" to "BoldOblique" — they do
# not match the filenames. Verify a change with `kitty --debug-font-fallback`
# and `ghostty +show-face --string=Ag --style=italic`.
#
# features="-liga -calt" is the direct equivalent of Ghostty's font-feature
# lines: it disables the OpenType features rather than un-drawing the ligature
# afterwards. disable_ligatures stays as a backstop in case a face is picked up
# through a path that skips the spec-level features. Berkeley ships no
# programming ligatures, so both are belt-and-braces here.
font_family                    postscript_name=BerkeleyMono-Regular     features="-liga -calt"
bold_font                      postscript_name=BerkeleyMono-Bold        features="-liga -calt"
italic_font                    postscript_name=BerkeleyMono-Oblique     features="-liga -calt"
bold_italic_font               postscript_name=BerkeleyMono-BoldOblique features="-liga -calt"
font_size                      16
disable_ligatures              always

# Berkeley Mono carries no Nerd Font icon glyphs, so the Private Use Area is
# mapped to the standalone Symbols Nerd Font — the non-Mono build, so icons keep
# their natural width rather than being squeezed into one cell. Installed on
# macOS by the font-symbols-only-nerd-font cask (macos/Brewfile) and on Linux by
# linux/setup.sh:install_symbols_nerd_font (Fedora packages no such font). If it
# is ever missing, kitty warns and falls back to its own built-in NF symbols
# (kitty >= 0.32) or the installed FiraCode Nerd Font, which cover the same
# range at different metrics — so a silent icon-width shift means this font
# went away.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Symbols Nerd Font

# Window decorations differ per OS; kitty expands ${KITTY_OS} in include paths
# (linux.conf / macos.conf). titlebar-only can't be shared: on macOS it hides
# the traffic-light buttons along with the bar, leaving no pointer way to close
# a window.
include ${KITTY_OS}.conf
macos_option_as_alt            yes
macos_colorspace               displayp3

# --- Background & Opacity ---
# 0.72 is what macOS gets. Linux overrides to 0.92 via local.conf (globinclude below).
# background_blur only takes effect on macOS (and KDE); Hyprland blurs on its own.
background                     #000000
background_opacity             0.72
background_blur                16
dynamic_background_opacity     yes

# --- Theme: VSCode Dark ---
foreground                     #cccccc
selection_foreground           #cccccc
selection_background           #264f78

color0   #000000
color1   #f14c4c
color2   #23d18b
color3   #f5f543
color4   #3b8eea
color5   #d670d6
color6   #29b8db
color7   #e5e5e5
color8   #666666
color9   #cd3131
color10  #0dbc79
color11  #e5e510
color12  #2472c8
color13  #bc3fbc
color14  #11a8cd
color15  #e5e5e5

# --- Keyboard Shortcuts ---
# Only what tmux cannot do. Note SUPER is claimed by Hyprland on Linux, so these
# fire on macOS (super = Cmd) and are inert on Linux — same as under Ghostty.

# Opacity. Ghostty's toggle_background_opacity has no kitty equivalent, so it is
# two binds instead of one toggle.
map super+shift+o              set_background_opacity 1.0
map ctrl+super+shift+o         set_background_opacity default

# New OS window — Hyprland's and macOS's job, not tmux's.
map super+enter                new_os_window_with_cwd
map ctrl+enter                 no_op

# Closing a window is deliberate-only; tmux holds the session either way.
map super+w                    no_op

# Home/End. Escape sequences, not ^A/^E: ^A is the tmux prefix and would
# swallow the keypress instead of moving the cursor.
map super+left                 send_text all \x1b[H
map super+right                send_text all \x1b[F

# --- Machine-local overrides ---
# Written by linux/setup.sh:write_kitty_local_conf, gitignored, same pattern as
# local.gitconfig and local.fish. globinclude (not include) so an absent file is
# silent rather than a startup warning — macOS never writes one and keeps the
# 0.72 above. This is where Linux's 0.92 lives, rather than on the launch
# command line: a `-o` flag only reaches kitty windows opened by that one
# keybind, leaving rofi, docker-menu.sh and .desktop launches at 0.72.
globinclude local.conf
