# kitty — the default terminal on both platforms. Ghostty is kept installed as a
# fallback (Linux: SUPER+SHIFT+ALT+Return).
#
# The two configs are kept in sync on everything EXCEPT the font block. kitty
# runs Berkeley Mono Regular 16; Ghostty runs FiraCode Nerd Font Retina 15.
# That divergence is deliberate and forced — see the fonts comment below and
# the matching one in shared/configs/ghostty/.config/ghostty/config.
#
# Deliberately has NO split or tab bindings. tmux owns that layer — C-a b/v to
# split, C-a h/j/k/l to move, C-a e to resize, C-a z to zoom, C-a c and Tab for
# windows — and tmux panes survive the terminal dying, which terminal-native
# splits do not. That stopped being hypothetical the day restarting the Ghostty
# server closed every window and the tmux sessions came back untouched.
#
# Shared with macOS. Anything Linux-only is passed as `-o key=value` at launch
# (see linux/configs/hypr/hyprland.lua) rather than written here.

# --- Core Settings ---
# Ghostty's scrollback-limit is bytes (10 MB); kitty's is lines. 20000 lines is
# the rough equivalent. scrollback_pager_history_size is the separate on-disk
# buffer the pager can reach, in MB.
scrollback_lines               20000
scrollback_pager_history_size  10

# Breathing room; kitty ships 0, which puts glyphs hard against the frame.
# Painted in `background`, not an opaque fill, so it stays translucent at both
# platforms' background_opacity (0.58 macOS / 0.92 Linux) rather than drawing a
# solid border. It also lifts tmux's status line off the bottom edge, and on
# Linux it keeps text clear of Hyprland's rounding = 14 corner arc, which at 0
# clips into the outermost cells.
window_padding_width           12
confirm_os_window_close        0

# Ghostty: shell-integration = fish / shell-integration-features = no-cursor.
# kitty detects the shell itself; no-cursor keeps it from managing cursor shape.
shell_integration              enabled no-cursor

# Ghostty: bell-features = no-system,no-audio,no-attention,no-title,no-border
enable_audio_bell              no
visual_bell_duration           0
window_alert_on_bell           no
bell_on_tab                    no

cursor_shape                   block
cursor_blink_interval          0
cursor                         #ffffff
cursor_text_color              #141414

# Animated cursor: the block eases to its new position instead of teleporting.
# start_threshold 2 animates only jumps of more than 2 cells, so ordinary typing
# stays instant and this fires on real movement (vim motions, search hits,
# prompt redraws). decay is min/max seconds. Needs kitty >= 0.42 — macOS is on
# 0.48.2 via Homebrew, Fedora resolves 0.48.2 from the sdegler/hyprland COPR
# (0.47.1 in Fedora's own updates if that COPR ever goes away), so both are fine.
cursor_trail                   3
cursor_trail_decay             0.1 0.4
cursor_trail_start_threshold   2

# --- Fonts ---
# Berkeley Mono — licensed; shared/fonts/ is a gitignored clone of the PRIVATE
# vishnukg/fonts repo, synced by shared/lib/fonts.sh at bootstrap (macOS then
# copies it in via ensure_local_fonts, Linux links it into
# ~/.local/share/fonts). It is a real text font, not one of the patched Nerd
# Font builds — those kitty's CoreText backend silently rejects (falling back
# to Menlo) because their double-width icon glyphs fail its monospace
# validation, which is why none is set as the text font here. That rejection is
# kitty-specific: Ghostty's font stack has no such check, and Ghostty now DOES
# run the patched FiraCode Nerd Font build. So the two terminals deliberately
# no longer share a font — do not "resync" this block to Ghostty's. On a machine
# without the font installed, kitty falls back to the platform default (Menlo /
# fontconfig's pick) — `gh auth login`, then re-run bootstrap (or
# shared/lib/fonts.sh) to fetch and install it.
#
# Because Berkeley resolves cleanly on BOTH of kitty's backends (CoreText and
# fontconfig), this block is shared across PLATFORMS — macos.conf carries no
# font override at all, unlike the FiraCode era. Shared across platforms, not
# across terminals: Ghostty has its own font block.
#
# The faces are addressed by postscript_name rather than family/style for the
# sake of macOS. Measured on Fedora with kitty 0.48.2: family="Berkeley Mono"
# with style="Bold"/"Oblique"/"Bold Oblique" resolves all four faces correctly,
# so the pins are NOT needed on Linux — they are needed on macOS, and this block
# is shared. The alternative is family/style here plus a pinned override back in
# macos.conf, which just moves the workaround rather than removing it.
#
# Why macOS needs them (from the OTF name tables):
#   BerkeleyMono-Oblique.otf       ID1 "Berkeley Mono Oblique"      ID2 "Regular"
#   BerkeleyMono-Bold-Oblique.otf  ID1 "Berkeley Mono Bold Oblique" ID2 "Regular"
#   BerkeleyMono-Bold.otf          ID1 "Berkeley Mono"              ID2 "Bold"
# Only the typographic names (16/17) say "Berkeley Mono" / "Oblique". fontconfig
# merges both sets, so style="Oblique" matches; CoreText keys off ID1/ID2, where
# the "Berkeley Mono" family holds ONLY Regular and Bold and the obliques are
# separate single-style families. A style= italic lookup finds nothing there.
#
# ─── LINUX ONLY, from here to the end of this comment ────────────────────────
# macOS resolves fonts through CoreText and has no fontconfig at all, so none of
# the following applies there. It is background on a Mac; it is load-bearing on
# Linux.
#
# Only BerkeleyMono-Regular.otf stores its advance widths in the compressed hmtx
# form (numberOfHMetrics=1). Every other face carries per-glyph metrics in which
# a handful of glyphs out of 645 deviate from the 600 unit width, so fontconfig
# scans them, concludes "not monospace", and leaves spacing unset. kitty's
# fontconfig backend queries :spacing=100 when resolving a text face, which makes
# those faces invisible to matching NO MATTER how they are addressed — the
# postscript_name pins above do not rescue it. linux/configs/fontconfig/fonts.conf
# corrects that by forcing the whole family to spacing=100 at scan time.
#
# Measured on kitty 0.48.2 with that one rule removed and nothing else changed:
# Normal stayed on Berkeley while Bold, Italic and Bold-Italic ALL silently
# resolved to FiraCode Nerd Font. No warning, no error — it just renders in the
# wrong font. That rule is not optional on Linux; if you touch it, re-check with
# `kitty --debug-font-fallback`.
# ─────────────────────────────────────────────────────────────────────────────

# features="-liga -calt" is the direct equivalent of Ghostty's font-feature
# lines: it disables the OpenType features rather than un-drawing the ligature
# afterwards. disable_ligatures stays as a backstop in case a face is picked up
# through a path that skips the spec-level features.
#
# For Berkeley specifically: its GSUB carries calt (plus aalt/ccmp/locl/salt and
# ss01-ss06) but NO liga. So -calt is the one doing the work — it is what
# suppresses the contextual arrow/comparison forms — while -liga is a harmless
# no-op kept for symmetry with the Ghostty config. Do not drop -calt thinking
# this font has no ligature machinery; it does, just under a different tag.
font_family                    postscript_name=BerkeleyMono-Regular     features="-liga -calt"
bold_font                      postscript_name=BerkeleyMono-Bold        features="-liga -calt"
italic_font                    postscript_name=BerkeleyMono-Oblique     features="-liga -calt"
bold_italic_font               postscript_name=BerkeleyMono-BoldOblique features="-liga -calt"
font_size                      16
disable_ligatures              always

# Berkeley Mono carries no Nerd Font icon glyphs, so the Private Use Area is
# mapped to the standalone Symbols Nerd Font — the non-Mono build, so icons keep
# their natural width rather than being squeezed into one cell. Installed on
# macOS by the font-symbols-only-nerd-font cask (macos/Brewfile) and on Linux by
# linux/setup.sh:install_symbols_nerd_font (Fedora packages no such font). If it
# is ever missing, kitty warns and falls back to its own built-in NF symbols
# (kitty >= 0.32) or the installed FiraCode Nerd Font, which cover the same
# range at different metrics — so a silent icon-width shift means this font
# went away.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Symbols Nerd Font

# --- macOS-only knobs (no-ops on Linux) ---
macos_option_as_alt            yes
macos_colorspace               displayp3

# --- Background & Opacity ---
# 0.58 is what macOS gets, deliberately the same value as Ghostty's
# background-opacity so the two terminals look identical on this platform.
# Linux overrides to 0.92 in linux.conf, which is
# included as the LAST line of this file so it wins. It has to be a config file
# rather than a `-o background_opacity=` flag: a flag only reaches windows opened
# by that one keybind, leaving rofi, docker-menu.sh and .desktop launches at 0.58.
# background_blur only takes effect on macOS (and KDE); Hyprland blurs on its own.
# It is deliberately 0: macOS window blur is a *window-server* effect, so kitty
# composites over a backdrop the compositor supplies. A single-window capture
# (Slack / Meet screen share, ScreenCaptureKit) has nothing behind the window,
# so that backdrop resolves to the material's flat base tint (~#BDBDBD) and the
# window is handed to the capture ALREADY FLATTENED and fully opaque --
# measured (at the old 0.72) as #353535 at alpha 255 (0.72*black + 0.28*189),
# i.e. a grey window instead of a transparent one. With blur off the capture
# keeps real alpha (0,0,0,184 = 0.72*255), which is what Ghostty does via
# background-blur=false. Ghostty is not immune: forced to blur it flattened the
# same way, to #505050 at alpha 255 -- 0.58*black + 0.42*190, the same ~#BD
# backdrop tint from an independent opacity, so this is macOS, not either app.
background                     #000000
background_opacity             0.58
background_blur                0
dynamic_background_opacity     yes

# --- Theme: VSCode Dark ---
foreground                     #cccccc
selection_foreground           #cccccc
selection_background           #264f78

# Hyperlink underline. kitty's default is #0087bd, a teal that belongs to no
# part of this palette; #3b8eea is color4. url_style stays curly (the default).
url_color                      #3b8eea

color0   #000000
color1   #f14c4c
color2   #23d18b
color3   #f5f543
color4   #3b8eea
color5   #d670d6
color6   #29b8db
color7   #e5e5e5
color8   #666666
color9   #cd3131
color10  #0dbc79
color11  #e5e510
color12  #2472c8
color13  #bc3fbc
color14  #11a8cd
color15  #e5e5e5

# --- Keyboard Shortcuts ---
# Only what tmux cannot do. Note SUPER is claimed by Hyprland on Linux, so these
# fire on macOS (super = Cmd) and are inert on Linux — same as under Ghostty.

# Opacity. Ghostty's toggle_background_opacity has no kitty equivalent, so it is
# two binds instead of one toggle.
map super+shift+o              set_background_opacity 1.0
map ctrl+super+shift+o         set_background_opacity default

# New OS window — Hyprland's and macOS's job, not tmux's.
map super+enter                new_os_window_with_cwd
map ctrl+enter                 no_op

# Closing a window is deliberate-only; tmux holds the session either way.
map super+w                    no_op

# Home/End. Escape sequences, not ^A/^E: ^A is the tmux prefix and would
# swallow the keypress instead of moving the cursor.
map super+left                 send_text all \x1b[H
map super+right                send_text all \x1b[F

# --- Per-OS overrides ---
# kitty expands ${KITTY_OS} in include paths, so this pulls in linux.conf or
# macos.conf. It is deliberately the LAST line: later values win, so an OS file
# can override any shared default above it. That is what lets linux.conf carry
# background_opacity 0.92 and its own titlebar setting. Move this line up and
# the shared values silently clobber them.
#
# titlebar-only can't be shared: on macOS it hides the traffic-light buttons
# along with the bar, leaving no pointer way to close a window.
include ${KITTY_OS}.conf
