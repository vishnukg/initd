# Linux-only kitty settings — pulled in from kitty.conf via
# `include ${KITTY_OS}.conf`, which is the LAST line of that file, so everything
# here overrides the shared defaults above it.

# Ghostty equivalent: gtk-titlebar = false. Hyprland draws no titlebars, so
# hiding the bar client-side costs nothing and skips kitty's CSD fallback.
hide_window_decorations        titlebar-only

# Linux runs more opaque than the 0.58 the shared config ships for macOS.
#
# This is a Linux value, not a per-machine one — every Linux box running this
# repo wants the same number — so it is committed here rather than generated
# into a gitignored local.conf. It also cannot be a `-o background_opacity=`
# launch flag: that would only reach windows opened by the $mod+Return bind and
# leave rofi, docker-menu.sh and .desktop launches at 0.58.
background_opacity             0.92

# Hyprland sizes every window, so a remembered size buys nothing here, and the
# remembered *state* is actively harmful: kitty 0.49 writes
# "window-state": "maximized" to ~/.cache/kitty/main.json when the last window
# closes maximized, and every later window then opens maximized over the tiles
# instead of splitting (2026-11-07). macOS keeps the default.
remember_window_size           no

# Heavier, higher-contrast text, matching what `platform` gives on macOS.
# On Linux `platform` means "1.0 0": linear blending with no contrast boost,
# so light text on this dark background renders thin and grey next to the same
# Berkeley Mono on the Mac. "1.7 30" is kitty's own macOS value (gamma 1.7,
# +30% contrast), so both machines now draw the terminal alike. Lower either
# number if text ever looks too bold; the docs suggest values around 1.2-1.7.
text_composition_strategy      1.7 30
