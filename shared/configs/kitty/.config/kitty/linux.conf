# Linux-only kitty settings — pulled in from kitty.conf via
# `include ${KITTY_OS}.conf`, which is the LAST line of that file, so everything
# here overrides the shared defaults above it.

# Ghostty equivalent: gtk-titlebar = false. Hyprland draws no titlebars, so
# hiding the bar client-side costs nothing and skips kitty's CSD fallback.
hide_window_decorations        titlebar-only

# Hyprland sizes every window, so a remembered size buys nothing here, and the
# remembered *state* is actively harmful: kitty 0.49 writes
# "window-state": "maximized" to ~/.cache/kitty/main.json when the last window
# closes maximized, and every later window then opens maximized over the tiles
# instead of splitting (2026-11-07). macOS keeps the default.
remember_window_size           no
