# Linux-only kitty settings — pulled in from kitty.conf via
# `include ${KITTY_OS}.conf`, which is the LAST line of that file, so everything
# here overrides the shared defaults above it.

# Ghostty equivalent: gtk-titlebar = false. Hyprland draws no titlebars, so
# hiding the bar client-side costs nothing and skips kitty's CSD fallback.
hide_window_decorations        titlebar-only

# Linux runs more opaque than the 0.72 the shared config ships for macOS.
#
# This is a Linux value, not a per-machine one — every Linux box running this
# repo wants the same number — so it is committed here rather than generated
# into a gitignored local.conf. It also cannot be a `-o background_opacity=`
# launch flag: that would only reach windows opened by the $mod+Return bind and
# leave rofi, docker-menu.sh and .desktop launches at 0.72.
background_opacity             0.92
