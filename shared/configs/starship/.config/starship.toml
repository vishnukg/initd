# Keep the prompt fast in large repos. The default Starship format probes many
# runtimes and cloud/tooling modules; keep the modules used in this repo set.
format = "$directory$git_branch$git_state$git_status$nodejs$golang$ruby$python$cmd_duration$line_break$character"
command_timeout = 250
scan_timeout = 10
add_newline = true

[directory]
truncation_length = 3
truncate_to_repo = true
style = "cyan bold"

[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold purple"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "red bold"
use_git_executable = true

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "yellow bold"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_visual_symbol = "[❮](bold yellow)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
