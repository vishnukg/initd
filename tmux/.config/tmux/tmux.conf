# Prefix: Ctrl+a
#
# Keep tmux in one explicit key namespace:
#   C-a <key> = tmux
#   \ <key>   = Neovim leader
#   C-w <key> = Neovim windows/splits
#
# If a program needs a real Ctrl+a, press C-a C-a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Windows
bind c new-window -c "#{pane_current_path}"
bind Tab next-window
bind BTab previous-window
bind n next-window
bind p previous-window
bind , command-prompt -I "#W" "rename-window '%%'"

# Splits (open in current path)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Pane navigation. Use the prefix so these never steal keys from Neovim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing. Uppercase mirrors h/j/k/l but changes size instead of focus.
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Handy pane/window management.
bind z resize-pane -Z
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# No delay for escape key
set -sg escape-time 0

# Longer history
set -g history-limit 10000

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-kitty:Tc"

# --- Nord — nerdy bar ---
# Polar Night: #2e3440  #3b4252  #434c5e  #4c566a
# Snow Storm:  #d8dee9  #e5e9f0  #eceff4
# Frost:       #8fbcbb  #88c0d0  #81a1c1  #5e81ac

# Pane borders
set -g pane-border-style "fg=#434c5e"
set -g pane-active-border-style "fg=#88c0d0"
set -g display-panes-colour "#4c566a"
set -g display-panes-active-colour "#88c0d0"

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#d8dee9"

set -g status-left-length 40
set -g status-left "#[bg=#5e81ac,fg=#2e3440,bold]  #S #[bg=default,fg=#5e81ac]  "

set -g window-status-separator " "
set -g window-status-format        "#[fg=#3b4252,bg=default]#[fg=#81a1c1,bg=#3b4252] #I:#{pane_current_command}:#{b:pane_current_path}:#{?#{==:#{window_index},1},✨,#{?#{==:#{window_index},2},🦄,#{?#{==:#{window_index},3},🍬,#{?#{==:#{window_index},4},🔮,#{?#{==:#{window_index},5},🍄,#{?#{==:#{window_index},6},🎨,#{?#{==:#{window_index},7},🎡,#{?#{==:#{window_index},8},💎,#{?#{==:#{window_index},9},🦩,#{?#{==:#{window_index},10},🚀,#{?#{==:#{window_index},11},💖,#{?#{==:#{window_index},12},🍩,#{?#{==:#{window_index},13},🦜,#{?#{==:#{window_index},14},🥇,#{?#{==:#{window_index},15},🎆,#{?#{==:#{window_index},16},👾,👾}}}}}}}}}}}}}}}} #[fg=#3b4252,bg=default]"
set -g window-status-current-format "#[fg=#88c0d0,bg=default]#[fg=#2e3440,bg=#88c0d0,bold] #I:#{pane_current_command}:#{b:pane_current_path}:#{?#{==:#{window_index},1},✨,#{?#{==:#{window_index},2},🦄,#{?#{==:#{window_index},3},🍬,#{?#{==:#{window_index},4},🔮,#{?#{==:#{window_index},5},🍄,#{?#{==:#{window_index},6},🎨,#{?#{==:#{window_index},7},🎡,#{?#{==:#{window_index},8},💎,#{?#{==:#{window_index},9},🦩,#{?#{==:#{window_index},10},🚀,#{?#{==:#{window_index},11},💖,#{?#{==:#{window_index},12},🍩,#{?#{==:#{window_index},13},🦜,#{?#{==:#{window_index},14},🥇,#{?#{==:#{window_index},15},🎆,#{?#{==:#{window_index},16},👾,👾}}}}}}}}}}}}}}}} #[fg=#88c0d0,bg=default,nobold]"

set -g status-right-length 80
set -g status-right "#[fg=#434c5e,bg=default]#[fg=#4c566a,bg=#434c5e]   #(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null | grep -v HEAD)  #[fg=#3b4252,bg=#434c5e]#[fg=#d8dee9,bg=#3b4252]  %d %b  #[fg=#88c0d0,bg=#3b4252]#[fg=#2e3440,bg=#88c0d0,bold]  %H:%M "

set -g message-style "bg=#3b4252,fg=#d8dee9"
set -g message-command-style "bg=#3b4252,fg=#88c0d0"
set -g mode-style "bg=#88c0d0,fg=#2e3440"

set -g clock-mode-colour "#88c0d0"
set -g clock-mode-style 24
