# Prefix: Ctrl+Space
#
# Keep tmux in one explicit key namespace:
#   C-Space <key> = tmux
#   \ <key>       = Neovim leader
#   C-w <key>     = Neovim windows/splits
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Windows
bind c new-window -c "#{pane_current_path}"
bind Tab next-window
bind BTab previous-window
bind n next-window
bind p previous-window
bind , command-prompt -I "#W" "rename-window '%%'"

# Splits (open in current path)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Pane navigation. Use the prefix so these never steal keys from Neovim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing. Uppercase mirrors h/j/k/l but changes size instead of focus.
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Handy pane/window management.
bind z resize-pane -Z
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -sg escape-time 0
set -g history-limit 10000

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-kitty:Tc"

# --- Kanagawa — Wave Aqua accent ---
# Crystal Blue: #7ab0c4   Wave Blue: #223249
# Surface:      #2a2a37   Fuji White: #dcd7ba

# Pane borders
set -g pane-border-style "fg=#223249"
set -g pane-active-border-style "fg=#7ab0c4"
set -g display-panes-colour "#727169"
set -g display-panes-active-colour "#7ab0c4"

set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#dcd7ba"

set -g status-left-length 40
set -g status-left "#[bg=#7ab0c4,fg=#1f1f28,bold]  #S #[bg=default,fg=#7ab0c4]  "

set -g window-status-separator " "
set -g window-status-format        "#[fg=#2a2a37,bg=default]#[fg=#938aa9,bg=#2a2a37] #I:#{pane_current_command}:#{b:pane_current_path}:#{?#{==:#{window_index},1},✨,#{?#{==:#{window_index},2},🦄,#{?#{==:#{window_index},3},🍬,#{?#{==:#{window_index},4},🔮,#{?#{==:#{window_index},5},🍄,#{?#{==:#{window_index},6},🎨,#{?#{==:#{window_index},7},🎡,#{?#{==:#{window_index},8},💎,#{?#{==:#{window_index},9},🦩,#{?#{==:#{window_index},10},🚀,#{?#{==:#{window_index},11},💖,#{?#{==:#{window_index},12},🍩,#{?#{==:#{window_index},13},🦜,#{?#{==:#{window_index},14},🥇,#{?#{==:#{window_index},15},🎆,#{?#{==:#{window_index},16},👾,👾}}}}}}}}}}}}}}}} #[fg=#2a2a37,bg=default]"
set -g window-status-current-format "#[fg=#7ab0c4,bg=default]#[fg=#1f1f28,bg=#7ab0c4,bold] #I:#{pane_current_command}:#{b:pane_current_path}:#{?#{==:#{window_index},1},✨,#{?#{==:#{window_index},2},🦄,#{?#{==:#{window_index},3},🍬,#{?#{==:#{window_index},4},🔮,#{?#{==:#{window_index},5},🍄,#{?#{==:#{window_index},6},🎨,#{?#{==:#{window_index},7},🎡,#{?#{==:#{window_index},8},💎,#{?#{==:#{window_index},9},🦩,#{?#{==:#{window_index},10},🚀,#{?#{==:#{window_index},11},💖,#{?#{==:#{window_index},12},🍩,#{?#{==:#{window_index},13},🦜,#{?#{==:#{window_index},14},🥇,#{?#{==:#{window_index},15},🎆,#{?#{==:#{window_index},16},👾,👾}}}}}}}}}}}}}}}} #[fg=#7ab0c4,bg=default,nobold]"

set -g status-right-length 40
set -g status-right "#[fg=#223249,bg=default]#[fg=#dcd7ba,bg=#223249]  %d %b  #[fg=#7ab0c4,bg=#223249]#[fg=#1f1f28,bg=#7ab0c4,bold]  %H:%M "

set -g message-style "bg=#2a2a37,fg=#dcd7ba"
set -g message-command-style "bg=#2a2a37,fg=#7ab0c4"
set -g mode-style "bg=#7ab0c4,fg=#1f1f28"

set -g clock-mode-colour "#7ab0c4"
set -g clock-mode-style 24
